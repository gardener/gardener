apiVersion: core.gardener.cloud/v1beta1
kind: CloudProfile
metadata:
  name: local
spec:
  type: local
  regions:
  - name: local
    zones:
    - name: "0"
    - name: "1"
    - name: "2"
  kubernetes:
    # We typically don't update the patch versions in the local cloud profile because this leads to failing upgrade tests.
    # When a specific patch version is needed for a bug fix or similar reason, keep the previous patch version for at least one more release.
    versions:
    - version: 1.37.0
      lifecycle:
        - classification: deprecated
          startTime: 2024-06-01T00:00:00Z
    - version: 1.36.0
      lifecycle:
        - classification: supported
          startTime: 2024-06-01T00:00:00Z
    - version: 1.35.4
      lifecycle:
        - classification: preview
          startTime: 2024-06-01T00:00:00Z
    - version: 1.34.3
      lifecycle:
        - classification: expired
          startTime: 2024-06-01T00:00:00Z
    - version: 1.33.0
      lifecycle:
        - classification: deprecated
          startTime: 2028-06-01T00:00:00Z
    - version: 1.32.0
      lifecycle:
        - classification: supported
          startTime: 2028-06-01T00:00:00Z
  # These values do not represent the actual machine capacity. The actual
  # capacity of the machine depends on your docker resource allocation.
  machineTypes:
  - cpu: "1"
    gpu: "0"
    memory: 8Gi
    name: local
  machineImages:
  - name: local
    versions:
    # This version is just used for in-place update e2e tests.
    - version: 2.0.0
      lifecycle:
        - classification: preview
          startTime: 2024-06-01T00:00:00Z
      cri:
      - name: containerd
      inPlaceUpdates:
        supported: true
        minVersionForUpdate: 1.0.0
    - version: 1.0.0
      lifecycle:
        - classification: supported
          startTime: 2024-06-01T00:00:00Z
      cri:
      - name: containerd
      inPlaceUpdates:
        supported: true
  - name: local2
    versions:
    # This version is just used for in-place update e2e tests.
    - version: 2.0.0
      lifecycle:
        - classification: supported
          startTime: 2024-06-01T00:00:00Z
      cri:
      - name: containerd
      inPlaceUpdates:
        supported: true
        minVersionForUpdate: 1.0.0
    - version: 1.0.0
      lifecycle:
        - classification: deprecated
          startTime: 2024-06-01T00:00:00Z
      cri:
      - name: containerd
      inPlaceUpdates:
        supported: true
    - version: 0.5.0
      lifecycle:
        - classification: expired
          startTime: 2028-06-01T00:00:00Z
      cri:
      - name: containerd
      inPlaceUpdates:
        supported: true
  providerConfig:
    apiVersion: local.provider.extensions.gardener.cloud/v1alpha1
    kind: CloudProfileConfig
    machineImages:
    - name: local
      versions:
      - version: 1.0.0
        image: local-skaffold/gardener-extension-provider-local/node:v1.0.0
      # This version is just used for in-place update e2e tests.
      - version: 2.0.0
        image: local-skaffold/gardener-extension-provider-local/node:v1.0.0
    - name: local2
      versions:
      - version: 0.5.0
        image: local-skaffold/gardener-extension-provider-local/node:v1.0.0
      - version: 1.0.0
        image: local-skaffold/gardener-extension-provider-local/node:v1.0.0
      - version: 2.0.0
        image: local-skaffold/gardener-extension-provider-local/node:v1.0.0
    loadBalancer:
      image: local-skaffold/gardener-extension-provider-local/loadbalancer:v1.0.0
