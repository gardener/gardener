apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |
      - op: add
        path: /spec/config/leaderElection
        value:
          leaderElect: false
      - op: add
        path: /spec/config/server
        value:
          healthProbes:
            enable: false
    target:
      group: seedmanagement.gardener.cloud
      kind: Gardenlet
