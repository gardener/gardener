apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |
      - op: replace
        path: /metadata/name
        value: remote
      - op: add
        path: /spec/kubeconfigSecretRef
        value:
          name: seed-remote
      - op: remove
        path: /spec/config/seedConfig/spec/backup
      - op: remove
        path: /spec/config/seedConfig/spec/extensions
      # The remote dev-setup registry is served with a publicly-trusted certificate, so gardenlet does not
      # need a custom CA bundle to pull its helm chart. Drop the caBundleSecretRef that base/patch-helm-ref.yaml
      # sets for the local-kind registry (whose self-signed CA secret is only generated for local scenarios).
      - op: remove
        path: /spec/deployment/helm/ociRepository/caBundleSecretRef
    target:
      group: seedmanagement.gardener.cloud
      kind: Gardenlet
      name: local
      namespace: garden
