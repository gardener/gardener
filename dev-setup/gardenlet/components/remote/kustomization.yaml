apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |
      - op: replace
        path: /metadata/name
        value: remote
      - op: add
        path: /spec/kubeconfigSecretRef
        value:
          name: seed-remote
      - op: remove
        path: /spec/config/seedConfig/spec/backup
      - op: remove
        path: /spec/config/seedConfig/spec/extensions
      # The remote dev-setup registry is served with a publicly-trusted certificate, so gardenlet does not
      # need a custom CA bundle to pull its helm chart. Drop the caBundleSecretRef that base/patch-helm-ref.yaml
      # sets for the local-kind registry (whose self-signed CA secret is only generated for local scenarios).
      - op: remove
        path: /spec/deployment/helm/ociRepository/caBundleSecretRef
    target:
      group: seedmanagement.gardener.cloud
      kind: Gardenlet
      name: local
      namespace: garden
  # base includes secret-registry-ca.yaml (the local-kind registry CA, generated by infra.sh). It is not needed
  # in the remote scenario - and remote.sh only touches the file to satisfy the base build - so drop it entirely
  # here instead of shipping an empty or stale secret.
  - patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: gardener-local-registry-ca
        namespace: garden
      $patch: delete
    target:
      kind: Secret
      name: gardener-local-registry-ca
      namespace: garden
