name: Validate release-notes from PRs
on:
  pull_request:
    types:
    - opened
    - edited
    - reopened

permissions:
  pull-requests: read

jobs:
  validate-release-notes:
    uses: gardener/cc-utils/.github/workflows/validate-release-notes.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    permissions:
      pull-requests: read
    with:
      pull-request-body: ${{ github.event.pull_request.body }}
