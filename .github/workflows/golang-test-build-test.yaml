name: Test golang-test Build

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/golang-test-build.yaml
      - .github/workflows/golang-test-images.yaml
      - hack/tools/image/**
      - hack/tools.mk
      - hack/tools/logcheck/**
      - go.mod

jobs:
  generate-matrix:
    name: Generate Matrix
    if: ${{ github.repository == 'gardener/gardener' }}
    permissions:
      contents: read
    uses: ./.github/workflows/golang-test-images.yaml

  build-golang-test:
    name: Build golang-test
    if: ${{ github.repository == 'gardener/gardener' }}
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build golang-test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./hack/tools/image/Dockerfile
          target: golang-test
          build-args: |
            image=${{ matrix.images.image }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
