apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: istio-ingressgateway
  namespace: test-ingress
  labels:
    app: istio-ingressgateway
    foo: bar
spec:
  maxUnavailable: 20%
  selector:
    matchLabels:
      app: istio-ingressgateway
      foo: bar
  unhealthyPodEvictionPolicy: AlwaysAllow
