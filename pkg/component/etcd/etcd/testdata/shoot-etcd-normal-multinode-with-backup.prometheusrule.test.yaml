rule_files:
- shoot-etcd-main.prometheusrule.yaml

evaluation_interval: 30s

tests:
- interval: 30s
  input_series:
  # KubeEtcdMainDown
  # KubeEtcdMainBackupRestoreDown
  - series: 'up{job="kube-etcd3-main"}'
    values: '1+0x70'
  # KubeEtcd3MainNoLeader
  - series: 'etcd_server_has_leader{job="kube-etcd3-main"}'
    values: '0+0x30'
  # KubeEtcd3MainDbSizeLimitApproaching
  # KubeEtcd3MainDbSizeLimitCrossed
  - series: 'etcd_mvcc_db_total_size_in_bytes{job="kube-etcd3-main", pod="etcd-main-0"}'
    values: '7300000000+0x40 8300000000+0x22' # 0-20m: 6.8GB (ratio 0.85), from 20m: 7.73GB (ratio 0.97)
  - series: 'etcd_server_quota_backend_bytes{job="kube-etcd3-main", pod="etcd-main-0"}'
    values: '8589934592+0x62' # 8Gi, constant
  # KubeEtcdMainDeltaBackupFailed
  - series: 'etcdbr_snapshot_latest_timestamp{job="kube-etcd3-backup-restore-main",kind="Incr", pod="etcd", role="test"}'
    values: '0+0x62'
  - series: 'etcdbr_snapshot_required{job="kube-etcd3-backup-restore-main",kind="Incr", pod="etcd", role="test"}'
    values: '1+0x62'
  - series: 'etcd_server_is_leader{job="kube-etcd3-main", pod="etcd", role="test"}'
    values: '1+0x70'
  # KubeEtcdMainFullBackupFailed
  - series: 'etcdbr_snapshot_latest_timestamp{job="kube-etcd3-backup-restore-main",kind="Full", pod="etcd", role="test"}'
    values: '0+0x2912'
  - series: 'etcdbr_snapshot_required{job="kube-etcd3-backup-restore-main",kind="Full", pod="etcd", role="test"}'
    values: '1+0x2912'
  - series: 'etcd_server_is_leader{job="kube-etcd3-main", pod="etcd", role="test"}'
    values: '1+0x2912'
  # KubeEtcdMainRestorationFailed
  - series: 'etcdbr_restoration_duration_seconds_count{job="kube-etcd3-backup-restore-main",succeeded="false"}'
    values: '0+0x7 1 2 2'
  # KubeEtcdMainBackupRestoreDown
  - series: 'up{job="kube-etcd3-backup-restore-main"}'
    values: '0+0x70'
  - series: 'etcdbr_snapshotter_failure{job="kube-etcd3-backup-restore-main"}'
    values: '1+1x30 1+0x40'
  alert_rule_test:
  - eval_time: 15m
    alertname: KubeEtcdMainDown
    exp_alerts:
    - exp_labels:
        service: etcd
        severity: critical
        type: seed
        visibility: operator
      exp_annotations:
        description: Etcd3 cluster main is unavailable (due to possible quorum loss) or cannot be scraped. As long as etcd3 main is down, the cluster is unreachable.
        summary: Etcd3 main cluster down.
  - eval_time: 15m
    alertname: KubeEtcd3MainNoLeader
    exp_alerts:
    - exp_labels:
        service: etcd
        severity: critical
        type: seed
        visibility: operator
      exp_annotations:
        description: Etcd3 cluster main has no leader. Possible network partition in the etcd cluster.
        summary: Etcd3 main has no leader.
  - eval_time: 20m
    alertname: KubeEtcd3MainDbSizeLimitApproaching
    exp_alerts:
    - exp_labels:
        job: kube-etcd3-main
        pod: etcd-main-0
        service: etcd
        severity: warning
        type: seed
        visibility: all
      exp_annotations:
        description: 'Etcd3 main DB size has reached 85% of its configured etcd quota. DB size: 6.799GiB, quota: 8GiB. Etcd quota might need to be increased.'
        summary: Etcd3 main DB size is approaching its configured quota.
  - eval_time: 26m
    alertname: KubeEtcd3MainDbSizeLimitCrossed
    exp_alerts:
    - exp_labels:
        job: kube-etcd3-main
        pod: etcd-main-0
        service: etcd
        severity: critical
        type: seed
        visibility: all
      exp_annotations:
        description: 'Etcd3 main DB size has reached 97% of its configured etcd quota. DB size: 7.73GiB, quota: 8GiB. Etcd quota must be increased to allow updates.'
        summary: Etcd3 main DB size has crossed its configured quota.
  - eval_time: 31m
    alertname: KubeEtcdMainDeltaBackupFailed
    exp_alerts:
    - exp_labels:
        pod: etcd
        role: test
        service: etcd
        severity: critical
        type: seed
        visibility: operator
      exp_annotations:
        description: No delta snapshot for the past 30 minutes have been taken by backup-restore leader.
        summary: Etcd delta snapshot failure.
  - eval_time: 1456m
    alertname: KubeEtcdMainFullBackupFailed
    exp_alerts:
    - exp_labels:
        pod: etcd
        role: test
        service: etcd
        severity: critical
        type: seed
        visibility: operator
      exp_annotations:
        description: No full snapshot for at least last 24 hours have been taken by backup-restore leader.
        summary: Etcd full snapshot failure.
  - eval_time: 5m
    alertname: KubeEtcdMainRestorationFailed
    exp_alerts:
    - exp_labels:
        job: kube-etcd3-backup-restore-main
        succeeded: false
        service: etcd
        severity: critical
        type: seed
        visibility: operator
      exp_annotations:
        description: Etcd data restoration was triggered, but has failed.
        summary: Etcd data restoration failure.
  - eval_time: 30m
    alertname: KubeEtcdMainBackupRestoreDown
    exp_alerts:
    - exp_labels:
        service: etcd
        severity: critical
        type: seed
        visibility: operator
      exp_annotations:
        description: Etcd backup restore main process down or snapshotter failed with error. Backups will not be triggered unless backup restore is brought back up. This is unsafe behaviour and may cause data loss.
        summary: Etcd backup restore main process down or snapshotter failed with error
