kind: Dashboard
metadata:
  name: etcd
  project: garden
spec:
  display:
    name: ETCD
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-desc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: role
            matchers:
              - etcd_cluster_version
        name: role
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Quorum
          description: Whether a majority of the desired etcd members currently see a leader. Compares the number of members reporting a leader against the majority of the StatefulSet's desired replicas, so it works for single-member and HA clusters. A single member being down does not turn this red as long as quorum is intact. Select a single role for a meaningful result.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: decimal
            mappings:
              - kind: Value
                spec:
                  result:
                    value: No quorum
                  value: "0"
              - kind: Value
                spec:
                  result:
                    value: Quorum
                  value: "1"
            thresholds:
              steps:
                - color: '#f2495c'
                  value: 0
                - color: '#73bf69'
                  value: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    (sum(etcd_server_has_leader{role=~"$role"}) or vector(0))
                    >= bool
                    (floor(max(kube_statefulset_replicas{statefulset=~"$role"}) / 2) + 1)
                  seriesNameFormat: ""
    "0_1":
      kind: Panel
      spec:
        display:
          name: Leader Changes / 1h
          description: Number of leader changes in the last hour. Frequent elections indicate Raft instability, typically caused by disk or network latency.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: decimal
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
                - color: '#fade2a'
                  value: 2
                - color: '#f2495c'
                  value: 4
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: changes(etcd_server_leader_changes_seen_total{role=~"$role"}[1h])
                  seriesNameFormat: '{{pod}}'
    "0_2":
      kind: Panel
      spec:
        display:
          name: gRPC Rate
          description: Current rate of incoming unary gRPC requests (reads + writes). Informational load context for interpreting the error rate and latency panels.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            format:
              unit: ops/sec
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(grpc_server_started_total{role=~"$role", grpc_type="unary"}[$__rate_interval]))
                  seriesNameFormat: ""
    "0_3":
      kind: Panel
      spec:
        display:
          name: gRPC Error %
          description: Percentage of unary gRPC requests that failed with a server-side error code for the selected duration. Only infrastructure-failure codes are counted (Unknown, ResourceExhausted, Unavailable, etc.) — application-level codes such as NotFound are excluded.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: percent
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
                - color: '#fade2a'
                  value: 1
                - color: '#f2495c'
                  value: 5
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    100 * sum(rate(grpc_server_handled_total{role=~"$role", grpc_type="unary", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[$__rate_interval]))
                    / sum(rate(grpc_server_started_total{role=~"$role", grpc_type="unary"}[$__rate_interval]))
                  seriesNameFormat: ""
    "0_4":
      kind: Panel
      spec:
        display:
          name: gRPC p99 Latency
          description: 99th percentile end-to-end latency of unary gRPC requests as seen by the server — the client-visible latency signal for the D in RED. Yellow above 500ms, red above 1s (the Kubernetes API p99 SLO for mutating calls, of which etcd is only one part). Only populated for the main etcd (requires extensive metrics); empty for events.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: seconds
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
                - color: '#fade2a'
                  value: 0.5
                - color: '#f2495c'
                  value: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{role=~"$role", grpc_type="unary"}[$__rate_interval])) by (le))
                  seriesNameFormat: ""
    "0_5":
      kind: Panel
      spec:
        display:
          name: DB Quota %
          description: Current DB size as a percentage of the configured etcd quota. At 100%, etcd stops accepting writes. Drill down to the DB Size panel for historical context.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: percent
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
                - color: '#fade2a'
                  value: 80
                - color: '#f2495c'
                  value: 95
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: 100 * max(etcd_mvcc_db_total_size_in_bytes{role=~"$role"}) / max(etcd_server_quota_backend_bytes{role=~"$role"})
                  seriesNameFormat: ""
    "0_6":
      kind: Panel
      spec:
        display:
          name: WAL Fsync p99
          description: 99th percentile WAL fsync latency. High values indicate disk I/O saturation and directly cause elevated write latency. Drill down to the Disk Sync Duration panel for historical context.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: seconds
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
                - color: '#fade2a'
                  value: 0.25
                - color: '#f2495c'
                  value: 0.5
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket{role=~"$role"}[$__rate_interval])) by (le))
                  seriesNameFormat: ""
    "0_7":
      kind: Panel
      spec:
        display:
          name: DB Not in Page Cache %
          description: Percentage of the in-use etcd DB not resident in the Linux page cache (worst pod). 0% means all in-use data is cached via mmap — ideal. Any value above 0% means etcd must read those pages from disk, causing elevated read IOPS. Right after a container or pod restart the cache is cold and this value is high without any eviction having happened. Correlate with Container Read IOPS and the DB Not in Page Cache % graph below to tell the two apart.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: percent
            thresholds:
              steps:
                - color: '#73bf69'
                  value: 0
                - color: '#fade2a'
                  value: 10
                - color: '#f2495c'
                  value: 30
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    clamp_min(
                      max(
                        100 * (1 - sum by (pod) (container_memory_mapped_file{container="etcd", pod=~"(${role:pipe})-.*"})
                        / sum by (pod) (etcd_mvcc_db_total_size_in_use_in_bytes{container="etcd", pod=~"(${role:pipe})-.*"}))
                    ), 0)
                  seriesNameFormat: ""
    "1_0":
      kind: Panel
      spec:
        display:
          name: gRPC Rate and Errors
          description: Unary gRPC request rate. Per-pod lines show load distribution across members — in an HA cluster they should be roughly balanced. Total is the cluster-wide rate. Failed counts requests that returned an infrastructure-level error code (Unknown, ResourceExhausted, Unavailable, etc.).
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            querySettings:
              - colorMode: fixed
                colorValue: '#F2495C'
                queryIndex: 2
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(grpc_server_started_total{role=~"$role",grpc_type="unary"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{pod}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(grpc_server_started_total{role=~"$role",grpc_type="unary"}[$__rate_interval]))
                  seriesNameFormat: Total
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(grpc_server_handled_total{role=~"$role",grpc_type="unary",grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[$__rate_interval]))
                  seriesNameFormat: Failed
    "1_1":
      kind: Panel
      spec:
        display:
          name: Active Watch Streams
          description: Number of currently open bidirectional gRPC Watch streams.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0
              connectNulls: true
              display: line
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(grpc_server_started_total{role=~"$role",grpc_service="etcdserverpb.Watch",grpc_type="bidi_stream"}) - sum(grpc_server_handled_total{role=~"$role",grpc_service="etcdserverpb.Watch",grpc_type="bidi_stream"})
                  seriesNameFormat: Watch Streams
    "1_2":
      kind: Panel
      spec:
        display:
          name: Write Operations (MVCC)
          description: Rate of key-value mutations at the MVCC storage layer, broken down by operation type. In Kubernetes, kube-apiserver wraps all writes in a Txn RPC — each Txn contains one Put (create/update) or one Delete. Put rate reflects object creates and updates; Delete rate reflects object deletions and expired resources. Drives DB growth, compaction frequency, and WAL load.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(etcd_mvcc_put_total{role=~"$role"}[$__rate_interval]))
                  seriesNameFormat: Put
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(etcd_mvcc_delete_total{role=~"$role"}[$__rate_interval]))
                  seriesNameFormat: Delete
    "1_3":
      kind: Panel
      spec:
        display:
          name: Client Traffic In
          description: Rate of bytes received by etcd from gRPC clients.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.5
              connectNulls: true
              display: line
              lineWidth: 2
              stack: all
            yAxis:
              format:
                unit: bytes/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: rate(etcd_network_client_grpc_received_bytes_total{role=~"$role"}[$__rate_interval])
                  seriesNameFormat: '{{pod}} Client Traffic In'
    "1_4":
      kind: Panel
      spec:
        display:
          name: Client Traffic Out
          description: Rate of bytes sent by etcd to gRPC clients.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.5
              connectNulls: true
              display: line
              lineWidth: 2
              stack: all
            yAxis:
              format:
                unit: bytes/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: rate(etcd_network_client_grpc_sent_bytes_total{role=~"$role"}[$__rate_interval])
                  seriesNameFormat: '{{pod}} Client Traffic Out'
    "2_0":
      kind: Panel
      spec:
        display:
          name: DB Size
          description: Total size of the etcd MVCC database file on disk, including free pages not yet reclaimed by defragmentation.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0
              connectNulls: true
              display: line
              lineWidth: 2
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: etcd_mvcc_db_total_size_in_bytes{role=~"$role"}
                  seriesNameFormat: '{{pod}} DB Size'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: etcd_mvcc_db_total_size_in_use_in_bytes{role=~"$role"}
                  seriesNameFormat: '{{pod}} DB Size (in use)'
    "2_1":
      kind: Panel
      spec:
        display:
          name: DB Not in Page Cache %
          description: Percentage of the in-use etcd DB not resident in the Linux page cache per pod. 0% is the healthy baseline — all mmap'd pages are in RAM. A rising value means the kernel is evicting etcd's pages under memory pressure (if container/pod wasn't restarted), forcing reads from disk on every access to evicted pages.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: percent
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    clamp_min(
                      100 * (1 - sum by (pod) (container_memory_mapped_file{container="etcd", pod=~"(${role:pipe})-.*"})
                      / sum by (pod) (etcd_mvcc_db_total_size_in_use_in_bytes{container="etcd", pod=~"(${role:pipe})-.*"})),
                    0)
                  seriesNameFormat: '{{pod}}'
    "2_2":
      kind: Panel
      spec:
        display:
          name: DB Page Cache vs DB Size
          description: 'Absolute bytes of etcd''s mmap''d file memory resident in the page cache vs. the in-use DB size. When the two lines diverge, part of the DB is not in the page cache: either pages were evicted under memory pressure, or the cache is still cold after a restart.'
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (pod) (container_memory_mapped_file{container="etcd", pod=~"(${role:pipe})-.*"})
                  seriesNameFormat: '{{pod}} Mapped File Memory'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (pod) (etcd_mvcc_db_total_size_in_use_in_bytes{container="etcd", pod=~"(${role:pipe})-.*"})
                  seriesNameFormat: '{{pod}} DB Size (in use)'
    "3_0":
      kind: Panel
      spec:
        display:
          name: gRPC Request Latency
          description: Latency distribution (p50/p90/p99) of unary gRPC requests over time. Use it to correlate latency spikes with disk sync duration, request rate or traffic. The percentile spread shows whether a spike is tail-only (p99 rises, p50 flat) or a distribution-wide shift. Only populated for the main etcd (requires extensive metrics); empty for events.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{role=~"$role", grpc_type="unary"}[$__rate_interval])) by (le))
                  seriesNameFormat: p99
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.90, sum(rate(grpc_server_handling_seconds_bucket{role=~"$role", grpc_type="unary"}[$__rate_interval])) by (le))
                  seriesNameFormat: p90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.50, sum(rate(grpc_server_handling_seconds_bucket{role=~"$role", grpc_type="unary"}[$__rate_interval])) by (le))
                  seriesNameFormat: p50
    "3_1":
      kind: Panel
      spec:
        display:
          name: Disk Sync Duration
          description: 99th percentile latency of WAL fsync (on the critical path of every write) and bbolt backend commit (batched in the background, roughly every 100ms). High values indicate disk I/O saturation.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0
              connectNulls: true
              display: line
              lineWidth: 2
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket{role=~"$role"}[$__rate_interval])) by (pod, le))
                  seriesNameFormat: '{{pod}} WAL fsync'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(etcd_disk_backend_commit_duration_seconds_bucket{role=~"$role"}[$__rate_interval])) by (pod, le))
                  seriesNameFormat: '{{pod}} Backend Commit'
    "3_2":
      kind: Panel
      spec:
        display:
          name: Slow Operations
          description: Rate of outlier operations flagged by etcd as taking too long. Slow applies occur when a committed Raft entry takes too long to be applied to the MVCC state machine — root cause is almost always disk (slow backend fsync). Slow read indexes occur when a linearizable read cannot confirm its read index with the leader quickly enough — root cause is Raft/network (leader overload or quorum delay). Both should be zero on a healthy cluster.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: rate(etcd_server_slow_apply_total{role=~"$role"}[$__rate_interval])
                  seriesNameFormat: '{{pod}} Slow Applies'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: rate(etcd_server_slow_read_indexes_total{role=~"$role"}[$__rate_interval])
                  seriesNameFormat: '{{pod}} Slow Read Indexes'
    "3_3":
      kind: Panel
      spec:
        display:
          name: gRPC Latency by Method (p99)
          description: p99 gRPC request latency broken down by method. Only methods with active traffic in the current window are shown. Helps identify whether latency spikes originate in reads (Range), writes (Txn), or other operations. Only populated for the main etcd (requires extensive metrics); empty for events.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{role=~"$role", grpc_type="unary"}[$__rate_interval])) by (grpc_method, le)) > 0
                  seriesNameFormat: '{{grpc_method}}'
    "3_4":
      kind: Panel
      spec:
        display:
          name: Container Disk Read Throughput
          description: Rate of bytes read from disk by the etcd container(s) as reported by cAdvisor (<pod-name> / <container-name>). Elevated read throughput on the etcd container combined with low DB page cache coverage points to etcd reading mmap'd pages that are not in the page cache, e.g. after eviction under memory pressure.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decbytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(container_fs_reads_bytes_total{pod=~"(${role:pipe})-.*"}[$__rate_interval])) by(pod, container)
                  seriesNameFormat: '{{pod}} / {{container}}'
    "3_5":
      kind: Panel
      spec:
        display:
          name: Container Disk Write Throughput
          description: Rate of bytes written to disk by the etcd container(s) as reported by cAdvisor (<pod-name> / <container-name>).
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decbytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(container_fs_writes_bytes_total{pod=~"(${role:pipe})-.*"}[$__rate_interval])) by(pod, container)
                  seriesNameFormat: '{{pod}} / {{container}}'
    "3_6":
      kind: Panel
      spec:
        display:
          name: Container Read IOPS
          description: Rate of filesystem read operations inside the etcd container(s) as reported by cAdvisor. A persistent spike here combined with low DB page cache coverage points to etcd reading mmap'd pages that are not in the page cache, e.g. after eviction under memory pressure.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(container_fs_reads_total{pod=~"(${role:pipe})-.*"}[$__rate_interval])) by(pod, container)
                  seriesNameFormat: '{{pod}} / {{container}}'
    "3_7":
      kind: Panel
      spec:
        display:
          name: Container Write IOPS
          description: Rate of filesystem write operations inside the etcd container(s) as reported by cAdvisor.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0.1
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(container_fs_writes_total{pod=~"(${role:pipe})-.*"}[$__rate_interval])) by(pod, container)
                  seriesNameFormat: '{{pod}} / {{container}}'
    "4_0":
      kind: Panel
      spec:
        display:
          name: Memory
          description: Resident set size (RSS) of the etcd process – the physical memory pages currently held in RAM.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0
              connectNulls: true
              display: line
              lineWidth: 2
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: process_resident_memory_bytes{role=~"$role"}
                  seriesNameFormat: '{{pod}} Resident Memory'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_pod_container_resource_requests{resource="memory", pod=~"(${role:pipe})-.*", container="etcd"}
                  seriesNameFormat: '{{pod}} Requests'
    "4_1":
      kind: Panel
      spec:
        display:
          name: CPU
          description: CPU usage of the etcd container.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              size: small
            visual:
              areaOpacity: 0
              connectNulls: true
              display: line
              lineWidth: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: rate(process_cpu_seconds_total{role=~"$role"}[$__rate_interval])
                  seriesNameFormat: '{{pod}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_pod_container_resource_requests{resource="cpu", unit="core", pod=~"(${role:pipe})-.*", container="etcd"}
                  seriesNameFormat: '{{pod}} Requests'
