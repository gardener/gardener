kind: Dashboard
metadata:
  name: apiserver-overview
  project: garden
spec:
  display:
    name: API Server
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Scrape Job
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: job
            matchers:
              - apiserver_request_total
        name: job
    - kind: ListVariable
      spec:
        display:
          name: API Server Pod
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
              - apiserver_request_total{job=~"$job"}
        name: pod
    - kind: ListVariable
      spec:
        display:
          name: Verbs
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - label: All
                value: $__all
              - DELETE
              - PUT
              - POST
              - DELETECOLLECTION
              - WATCH
              - GET
              - LIST
              - PATCH
              - CONNECT
              - UPDATE
              - CREATE
        name: verb
    - kind: ListVariable
      spec:
        display:
          name: Admission Operation
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - label: All
                value: $__all
              - CREATE
              - UPDATE
              - DELETE
        name: operation
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue: "0.99"
        allowAllValue: false
        allowMultiple: false
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: quantile
            matchers:
              - shoot:apiserver_latency_seconds:quantile
        name: quantile
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Overall Request Rates
          description: Shows the rate of all API server requests.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod"}[$__rate_interval]))
                  seriesNameFormat: Request Rate
    "0_1":
      kind: Panel
      spec:
        display:
          name: Error & Throttle Rate %
          description: 5xx error rate and 429 throttle rate as a percentage of total requests. 5xx indicates a server-side failure; 429 indicates intentional load shedding by APF. Streaming subresources are excluded from both.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod",code=~"5..",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])) / sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])) * 100
                  seriesNameFormat: 5xx — server errors
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod",code="429",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])) / sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])) * 100
                  seriesNameFormat: 429 — throttled
    "0_2":
      kind: Panel
      spec:
        display:
          name: Request Latency
          description: Shows the request latency of each verb for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: max by(verb, quantile) (shoot:apiserver_latency_seconds:quantile{job=~"$job",pod=~"$pod", verb=~"$verb",quantile=~"$quantile",verb!~"WATCH|CONNECT",subresource!~"log|portforward|exec|proxy|attach"})
                  seriesNameFormat: '{{verb}}'
    "0_3":
      kind: Panel
      spec:
        display:
          name: Restarts
          description: Number of kube-apiserver container restarts in the selected time range.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: decimal
            thresholds:
              steps:
                - color: '#fade2a'
                  value: 1
                - color: '#f2495c'
                  value: 3
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(changes(kube_pod_container_status_restarts_total{job=~"$job",pod=~"$pod",container="kube-apiserver"}[$__range]))
    "0_4":
      kind: Panel
      spec:
        display:
          name: Restart & OOM Kill History
          description: Raw restart and OOM kill counters for each kube-apiserver pod. Each step up on the staircase is one event. An OOM kill step always coincides with a restart step; a restart step without a matching OOM step indicates a non-OOM cause (crash, rollout, etc.).
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(kube_pod_container_status_restarts_total{job=~"$job",pod=~"$pod",container="kube-apiserver"}) by (pod)
                  seriesNameFormat: '{{pod}} restarts'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(container_oom_events_total{job=~"$job",pod=~"$pod",container="kube-apiserver"}) by (pod)
                  seriesNameFormat: '{{pod}} OOM kills'
    "0_5":
      kind: Panel
      spec:
        display:
          name: OOM Kills
          description: Number of OOM kill events for the kube-apiserver container in the selected time range.
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: background_solid
            format:
              unit: decimal
            thresholds:
              steps:
                - color: '#fade2a'
                  value: 1
                - color: '#f2495c'
                  value: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(changes(container_oom_events_total{job=~"$job",pod=~"$pod",container="kube-apiserver"}[$__range]))
    "1_0":
      kind: Panel
      spec:
        display:
          name: Request Rates Per Verb
          description: Shows the request rate per verb for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(verb)
                  seriesNameFormat: '{{verb}}'
    "1_1":
      kind: Panel
      spec:
        display:
          name: Request Rates Per Scope
          description: Shows the request rate per scope for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod",scope!=""}[$__rate_interval])) by(scope)
                  seriesNameFormat: '{{scope}}-scope'
    "1_2":
      kind: Panel
      spec:
        display:
          name: Request Rates Per Resource
          description: Shows the request rate per resource for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(resource)
                  seriesNameFormat: '{{resource}}'
    "1_3":
      kind: Panel
      spec:
        display:
          name: Request Rates Per Code and Resource
          description: Shows the request rate per code and resource for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(code, resource, subresource)
                  seriesNameFormat: '{{code}} /{{resource}} /{{subresource}}'
    "1_4":
      kind: Panel
      spec:
        display:
          name: Request Rates Per Verb And Resource
          description: Shows the request rate per verb and resource for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",verb=~"$verb",pod=~"$pod"}[$__rate_interval])) by(resource,verb,subresource)
                  seriesNameFormat: '{{verb}} /{{resource}}/{{subresource}}'
    "1_5":
      kind: Panel
      spec:
        display:
          name: Request Rates Per Code, Verb And Resource
          description: Shows the request rate per code, verb and resource for the API server.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_total{job=~"$job",verb=~"$verb",pod=~"$pod"}[$__rate_interval])) by(code, resource, verb, subresource)
                  seriesNameFormat: '{{code}} /{{verb}} /{{resource}} /{{subresource}}'
    "2_0":
      kind: Panel
      spec:
        display:
          name: Read Latency by Scope
          description: 'p99 read (LIST/GET) latency broken down by request scope. Kubernetes API SLO reference thresholds: cluster-scoped <40s, namespace-scoped <5s, resource-scoped <1s.'
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile($quantile, sum by (le, scope) (rate(apiserver_request_duration_seconds_bucket{job=~"$job",pod=~"$pod",verb=~"LIST|GET",scope!="",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])))
                  seriesNameFormat: '{{scope}}'
    "2_1":
      kind: Panel
      spec:
        display:
          name: Write Latency by Verb
          description: 'p99 write latency broken down by verb (POST/PUT/PATCH/DELETE). Kubernetes API SLO reference threshold: <1s. Divergence between verbs often points to a specific resource type or webhook.'
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile($quantile, sum by (le, verb) (rate(apiserver_request_duration_seconds_bucket{job=~"$job",pod=~"$pod",verb=~"POST|PUT|PATCH|DELETE",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])))
                  seriesNameFormat: '{{verb}}'
    "2_2":
      kind: Panel
      spec:
        display:
          name: Write Latency by Resource
          description: p99 write latency broken down by resource type. Use alongside 'Write Latency p99 by Verb' to identify which resource is causing spikes. High latency on a specific resource often points to etcd key contention or a slow admission webhook on that resource.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile($quantile, sum by (le, resource) (rate(apiserver_request_duration_seconds_bucket{job=~"$job",pod=~"$pod",verb=~"POST|PUT|PATCH|DELETE",subresource!~"log|portforward|exec|proxy|attach"}[$__rate_interval])))
                  seriesNameFormat: '{{resource}}'
    "3_0":
      kind: Panel
      spec:
        display:
          name: Duration Per In-Tree Plugin
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(apiserver_admission_controller_admission_duration_seconds_bucket{job=~"$job",pod=~"$pod",operation=~"$operation"}[$__rate_interval])) by(le,name))
                  seriesNameFormat: '{{name}}'
        links:
          - name: Drill Down
            url: /d/apiserver-admission-details/apiserver-admission-details
            targetBlank: true
    "3_1":
      kind: Panel
      spec:
        display:
          name: Duration Per Webhook
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(apiserver_admission_webhook_admission_duration_seconds_bucket{job=~"$job",pod=~"$pod",operation=~"$operation"}[$__rate_interval])) by(le,name))
                  seriesNameFormat: '{{name}}'
        links:
          - name: Drill Down
            url: /d/apiserver-admission-details/apiserver-admission-details
            targetBlank: true
    "3_2":
      kind: Panel
      spec:
        display:
          name: Duration Per Step
          description: p$quantile admission latency broken down by admission step (VALIDATE, ADMIT, WEBHOOK). The WEBHOOK step reflects all admission webhooks collectively; use 'Duration Per Webhook' to identify which webhook is slow.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(apiserver_admission_step_admission_duration_seconds_bucket{job=~"$job",pod=~"$pod",operation=~"$operation"}[$__rate_interval])) by(le,type))
                  seriesNameFormat: '{{type}}'
    "3_3":
      kind: Panel
      spec:
        display:
          name: Rejection Count Per Webhook
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_admission_webhook_rejection_count{job=~"$job",pod=~"$pod",operation=~"$operation"}[$__rate_interval])) by (name,error_type)
                  seriesNameFormat: '{{name}} ({{error_type}})'
    "4_0":
      kind: Panel
      spec:
        display:
          name: Response Sizes Per Resource
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(apiserver_response_sizes_bucket{job=~"$job",pod=~"$pod",verb=~"$verb"}[$__rate_interval])) by(le,resource,subresource))
                  seriesNameFormat: '{{resource}}{{subresource}}'
        links:
          - name: Drill Down
            url: /d/apiserver-request-details/apiserver-request-details
            targetBlank: true
    "4_1":
      kind: Panel
      spec:
        display:
          name: Response Size Rate Per Resource and Verb
          description: |-
            This panel shows the rate of response sizes by resource and verb.

            Outstandingly high values could give a hint for shoot operators on where
            to start on the journey of reducing the load on the API servers,
            by making sure to use WATCH requests instead of periodic LIST and
            GET requests in the various controllers.

            High values for WATCH requests could hint at reducing the rate of change for the specific resource.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_response_sizes_sum{job=~"$job",pod=~"$pod",verb=~"$verb"}[$__rate_interval])) by(resource, verb) > 0
                  seriesNameFormat: '{{resource}} {{verb}}'
    "5_0":
      kind: Panel
      spec:
        display:
          name: APF Seat Utilization %
          description: APF seat capacity in use per priority level. Values approaching 100% mean requests will queue or be rejected before 5xx errors appear.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: percent
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum by (priority_level) (apiserver_flowcontrol_current_executing_seats{job=~"$job",pod=~"$pod"} or apiserver_flowcontrol_request_concurrency_in_use{job=~"$job",pod=~"$pod"}) / on(priority_level) group_left() max by (priority_level) (apiserver_flowcontrol_nominal_limit_seats{job=~"$job",pod=~"$pod"}) * 100
                  seriesNameFormat: '{{priority_level}}'
    "5_1":
      kind: Panel
      spec:
        display:
          name: APF Rejections by Priority Level
          description: Rate of requests rejected by APF per priority level and reason (queue-full, concurrency-limit, time-out).
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: requests/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum by (priority_level, reason) (rate(apiserver_flowcontrol_rejected_requests_total{job=~"$job",pod=~"$pod"}[$__rate_interval]))
                  seriesNameFormat: '{{priority_level}} ({{reason}})'
    "5_2":
      kind: Panel
      spec:
        display:
          name: APF Queue Wait Latency
          description: Time requests spend waiting in APF queues per priority level. Non-zero wait times indicate a priority level is saturated. Sustained wait times precede APF rejections and are an earlier warning signal than seat utilization alone.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile($quantile, sum by (le, priority_level) (rate(apiserver_flowcontrol_request_wait_duration_seconds_bucket{job=~"$job",pod=~"$pod"}[$__rate_interval])))
                  seriesNameFormat: '{{priority_level}}'
    "5_3":
      kind: Panel
      spec:
        display:
          name: Inflight Requests By Request Kind
          description: Instantaneous count of in-flight requests, split by mutating vs read-only. Shown as max_over_time to capture spikes within a scrape interval. With APF enabled, APF Seat Utilization is the primary saturation signal; use this panel to correlate with pre-APF baselines.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(max_over_time(apiserver_current_inflight_requests{job=~"$job",pod=~"$pod"}[1m])) by (request_kind)
                  seriesNameFormat: '{{request_kind}}'
    "5_4":
      kind: Panel
      spec:
        display:
          name: Inqueue Requests By Request Kind
          description: Instantaneous count of requests waiting in APF queues, split by mutating vs read-only. Non-zero values indicate a priority level is saturated. Sustained queue depth precedes APF rejections.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(max_over_time(apiserver_current_inqueue_requests{job=~"$job",pod=~"$pod"}[1m])) by (request_kind)
                  seriesNameFormat: '{{request_kind}}'
    "5_5":
      kind: Panel
      spec:
        display:
          name: Request Terminations By Resource And Code
          description: 'Requests the API server forcibly terminated before completion, broken down by resource type and HTTP status code. A termination differs from a normal error response: the server initiated the disconnect (e.g. due to a timeout or APF deadline). Sustained high rates indicate overload or long-running requests being killed.'
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_request_terminations_total{job=~"$job",pod=~"$pod",verb=~"$verb"}[$__rate_interval])) by (resource,subresource,code)
                  seriesNameFormat: '{{ resource }}{{subresource}} ({{code}})'
    "6_0":
      kind: Panel
      spec:
        display:
          name: etcd Round-Trip Latency
          description: 99th percentile latency of etcd calls from the kube-apiserver per operation. Elevated values indicate etcd is the bottleneck. Sustained p99 >500ms warrants investigating etcd health.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile($quantile, sum by (le, operation) (rate(etcd_request_duration_seconds_bucket{job=~"$job",pod=~"$pod"}[$__rate_interval])))
                  seriesNameFormat: '{{operation}}'
    "6_1":
      kind: Panel
      spec:
        display:
          name: ETCD Request Duration Per Resource
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(etcd_request_duration_seconds_bucket{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(le,resource))
                  seriesNameFormat: '{{resource}}'
        links:
          - name: Drill Down
            url: /d/apiserver-storage-details/apiserver-storage-details
            targetBlank: true
    "6_2":
      kind: Panel
      spec:
        display:
          name: ETCD Total Size
          description: Total etcd database size in bytes per endpoint. etcd performance degrades as the database grows. Watch for a sustained upward trend; compaction is automatic but can lag under heavy write loads.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: max(apiserver_storage_size_bytes{job=~"$job",pod=~"$pod"}) by (endpoint)
                  seriesNameFormat: '{{endpoint}}'
    "6_3":
      kind: Panel
      spec:
        display:
          name: ETCD Object Counts By Resource
          description: Count of objects stored in etcd per resource type. Resource bloat (e.g. large numbers of ConfigMaps or Secrets) can cause slow LIST responses and increase etcd memory pressure.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: max(apiserver_storage_objects{job=~"$job",pod=~"$pod"}) by (resource)
                  seriesNameFormat: '{{resource}}'
    "6_4":
      kind: Panel
      spec:
        display:
          name: Storage Transformation Duration By Type
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(apiserver_storage_transformation_duration_seconds_bucket{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(le,transformation_type))
                  seriesNameFormat: '{{transformation_type}}'
    "6_5":
      kind: Panel
      spec:
        display:
          name: Total Storage Transformation Operations By Type And Prefix
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_storage_transformation_operations_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by (transformation_type,transformer_prefix)
                  seriesNameFormat: '{{transformation_type}},{{transformer_prefix}}'
    "7_0":
      kind: Panel
      spec:
        display:
          name: Total Events
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_audit_event_total{job=~"$job",pod=~"$pod"}[$__rate_interval]))
                  seriesNameFormat: Events
    "7_1":
      kind: Panel
      spec:
        display:
          name: Rejected Events
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_audit_requests_rejected_total{job=~"$job",pod=~"$pod"}[$__rate_interval]))
                  seriesNameFormat: Events
    "8_0":
      kind: Panel
      spec:
        display:
          name: Total Authenticated User Requests
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(authenticated_user_requests{job=~"$job",pod=~"$pod"}[$__rate_interval]))
                  seriesNameFormat: Requests
    "8_1":
      kind: Panel
      spec:
        display:
          name: Authentication Attempts By Result
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(authentication_attempts{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(result)
                  seriesNameFormat: '{{result}}'
    "9_0":
      kind: Panel
      spec:
        display:
          name: Registered Watches Per Kind
          description: Panel shows how many watches are open (including the API Server's in-tree admission plug-ins).
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |2-
                        sum by (kind) (apiserver_registered_watchers{job=~"$job",pod=~"$pod",kind!=""})
                      + on () group_left ()
                        absent(apiserver_longrunning_requests) * 0
                    or
                      sum by (resource) (apiserver_longrunning_requests{job=~"$job",pod=~"$pod",verb="WATCH"})
                  seriesNameFormat: '{{resource}}{{kind}}'
    "9_1":
      kind: Panel
      spec:
        display:
          name: Init Event Count Per Resource
          description: Counter of init events processed in watch cache.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_init_events_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(resource)
                  seriesNameFormat: '{{resource}}'
    "9_2":
      kind: Panel
      spec:
        display:
          name: Event Size Per Kind
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($quantile,sum(rate(apiserver_watch_events_sizes_bucket{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(le,resource))
                  seriesNameFormat: '{{resource}}'
        links:
          - name: Drill Down
            url: /d/apiserver-watch-details/apiserver-watch-details
            targetBlank: true
    "9_3":
      kind: Panel
      spec:
        display:
          name: Event Count Per Kind
          description: Shows the watch event count per kind
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(apiserver_watch_events_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by(kind)
                  seriesNameFormat: '{{kind}}'
    "9_4":
      kind: Panel
      spec:
        display:
          name: Cache Capacity Increases By Resource
          description: Rate of watch-cache capacity increase events per resource. An increase event means the cache reflector detected it was too small and doubled its size. Frequent increases indicate heavy watch event volume for that resource.
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(watch_cache_capacity_increase_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by (group,resource)
                  seriesNameFormat: '{{resource}}'
    "9_5":
      kind: Panel
      spec:
        display:
          name: Cache Capacity Decreases By Resource
          description: Rate of watch-cache capacity decrease events per resource. A decrease event means the cache was oversized and halved its allocation. Normal housekeeping; notable only if it immediately follows increases (thrashing).
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(watch_cache_capacity_decrease_total{job=~"$job",pod=~"$pod"}[$__rate_interval])) by (group,resource)
                  seriesNameFormat: '{{resource}}'
