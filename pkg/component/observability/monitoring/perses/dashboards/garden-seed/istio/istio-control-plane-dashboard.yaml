kind: Dashboard
metadata:
  name: istio-control-plane
  project: garden
spec:
  display:
    name: Istio Control Plane Dashboard
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: DatasourceVariable
          spec:
            datasourcePluginKind: PrometheusDatasource
        name: datasource
    - kind: ListVariable
      spec:
        display:
          name: istiod
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
              - pilot_services{}
        name: istiod
    - kind: ListVariable
      spec:
        display:
          name: Ingress Gateway
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
              - envoy_server_hot_restart_epoch{}
        name: igw
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Pilot Versions
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(istio_build{component="pilot", pod=~"$istiod"}) by (tag)
                  seriesNameFormat: '{{ tag }}'
    "1_0":
      kind: Panel
      spec:
        display:
          name: Memory
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(process_virtual_memory_bytes{job="istiod"})
                  seriesNameFormat: Virtual Memory
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(process_resident_memory_bytes{job="istiod"})
                  seriesNameFormat: Resident Memory
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(go_memstats_heap_sys_bytes{job="istiod"})
                  seriesNameFormat: heap sys
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(go_memstats_heap_alloc_bytes{job="istiod"})
                  seriesNameFormat: heap alloc
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(go_memstats_alloc_bytes{job="istiod"})
                  seriesNameFormat: Alloc
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(go_memstats_heap_inuse_bytes{job="istiod"})
                  seriesNameFormat: Heap in-use
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(go_memstats_stack_inuse_bytes{job="istiod"})
                  seriesNameFormat: Stack in-use
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: seed:container_memory_working_set_bytes:sum_by_container{container="discovery"}
                  seriesNameFormat: Discovery (container)
    "1_1":
      kind: Panel
      spec:
        display:
          name: CPU
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: |
                    seed:container_cpu_usage_seconds_total:sum_by_container{container="discovery"}
                  seriesNameFormat: Discovery (container)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(irate(process_cpu_seconds_total{job="istiod"}[$__rate_interval]))
                  seriesNameFormat: Discovery (process)
    "1_2":
      kind: Panel
      spec:
        display:
          name: Disk
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(container_fs_usage_bytes{container="discovery", pod=~"$istiod"})
                  seriesNameFormat: Discovery
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(container_fs_usage_bytes{container="istio-proxy", pod=~"$istiod"})
                  seriesNameFormat: Sidecar
    "1_3":
      kind: Panel
      spec:
        display:
          name: Goroutines
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(go_goroutines{job="istiod", pod=~"$istiod"})
                  seriesNameFormat: Number of Goroutines
    "2_0":
      kind: Panel
      spec:
        display:
          name: Pilot Pushes
          description: Shows the rate of pilot pushes
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: ops/sec
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(pilot_xds_pushes{type="cds", pod=~"$istiod"} - pilot_xds_pushes{type="cds", pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Cluster
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(pilot_xds_pushes{type="eds", pod=~"$istiod"} - pilot_xds_pushes{type="eds", pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Endpoints
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(pilot_xds_pushes{type="lds", pod=~"$istiod"} - pilot_xds_pushes{type="lds", pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Listeners
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(pilot_xds_pushes{type="rds", pod=~"$istiod"} - pilot_xds_pushes{type="rds", pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Routes
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(pilot_xds_pushes{type="sds", pod=~"$istiod"} - pilot_xds_pushes{type="sds", pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Secrets
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(pilot_xds_pushes{type="nds", pod=~"$istiod"} - pilot_xds_pushes{type="nds", pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Nametables
    "2_1":
      kind: Panel
      spec:
        display:
          name: Pilot Errors
          description: Captures a variety of pilot errors
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(pilot_xds_cds_reject{job="istiod", pod=~"$istiod"}) or (absent(pilot_xds_cds_reject{job="istiod", pod=~"$istiod"}) - 1)
                  seriesNameFormat: Rejected CDS Configs
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(pilot_xds_eds_reject{job="istiod", pod=~"$istiod"}) or (absent(pilot_xds_eds_reject{job="istiod", pod=~"$istiod"}) - 1)
                  seriesNameFormat: Rejected EDS Configs
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(pilot_xds_rds_reject{job="istiod", pod=~"$istiod"}) or (absent(pilot_xds_rds_reject{job="istiod", pod=~"$istiod"}) - 1)
                  seriesNameFormat: Rejected RDS Configs
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(pilot_xds_lds_reject{job="istiod", pod=~"$istiod"}) or (absent(pilot_xds_lds_reject{job="istiod", pod=~"$istiod"}) - 1)
                  seriesNameFormat: Rejected LDS Configs
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(pilot_xds_write_timeout{job="istiod", pod=~"$istiod"}[$__rate_interval]))
                  seriesNameFormat: Write Timeouts
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(pilot_total_xds_internal_errors{job="istiod", pod=~"$istiod"}[$__rate_interval]))
                  seriesNameFormat: Internal Errors
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(pilot_total_xds_rejects{job="istiod", pod=~"$istiod"}[$__rate_interval]))
                  seriesNameFormat: Config Rejection Rate
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(pilot_xds_push_context_errors{job="istiod", pod=~"$istiod"}[$__rate_interval]))
                  seriesNameFormat: Push Context Errors
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(rate(pilot_xds_write_timeout{job="istiod", pod=~"$istiod"}[$__rate_interval]))
                  seriesNameFormat: Push Timeouts
    "2_2":
      kind: Panel
      spec:
        display:
          name: Proxy Push Time
          description: Shows the total time it takes to push a config update to a proxy
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile(0.5, sum(rate(pilot_proxy_convergence_time_bucket[$__rate_interval])) by (le))
                  seriesNameFormat: 'p50 '
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile(0.9, sum(rate(pilot_proxy_convergence_time_bucket[$__rate_interval])) by (le))
                  seriesNameFormat: p90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile(0.99, sum(rate(pilot_proxy_convergence_time_bucket[$__rate_interval])) by (le))
                  seriesNameFormat: p99
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: histogram_quantile(0.999, sum(rate(pilot_proxy_convergence_time_bucket[$__rate_interval])) by (le))
                  seriesNameFormat: p99.9
    "2_3":
      kind: Panel
      spec:
        display:
          name: Conflicts
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: pilot_conflict_inbound_listener{job="istiod"}
                  seriesNameFormat: Inbound Listeners
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: pilot_conflict_outbound_listener_http_over_current_tcp{job="istiod"}
                  seriesNameFormat: Outbound Listeners (http over current tcp)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: pilot_conflict_outbound_listener_tcp_over_current_tcp{job="istiod"}
                  seriesNameFormat: Outbound Listeners (tcp over current tcp)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: pilot_conflict_outbound_listener_tcp_over_current_http{job="istiod"}
                  seriesNameFormat: Outbound Listeners (tcp over current http)
    "2_4":
      kind: Panel
      spec:
        display:
          name: ADS Monitoring
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: avg(pilot_virt_services{job="istiod"})
                  seriesNameFormat: Virtual Services
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: avg(pilot_services{job="istiod"})
                  seriesNameFormat: Services
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(pilot_xds{job="istiod"}) by (pod)
                  seriesNameFormat: Connected Endpoints {{pod}}
    "3_0":
      kind: Panel
      spec:
        display:
          name: Envoy Details
          description: Shows details about Envoy proxies in the mesh
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: ops/sec
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(envoy_cluster_upstream_cx_total{cluster_name="xds-grpc", pod=~"$igw"} - envoy_cluster_upstream_cx_total{cluster_name="xds-grpc", pod=~"$igw"} offset $__interval, 0))
                  seriesNameFormat: XDS Connections
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(envoy_cluster_upstream_cx_connect_fail{cluster_name="xds-grpc", pod=~"$igw"} - envoy_cluster_upstream_cx_connect_fail{cluster_name="xds-grpc", pod=~"$igw"} offset $__interval, 0))
                  seriesNameFormat: XDS Connection Failures
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(envoy_server_hot_restart_epoch{pod=~"$igw"} - envoy_server_hot_restart_epoch{pod=~"$igw"} offset $__interval, 0))
                  seriesNameFormat: Envoy Restarts
    "3_1":
      kind: Panel
      spec:
        display:
          name: XDS Active Connections
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(envoy_cluster_upstream_cx_active{cluster_name="xds-grpc"})
                  seriesNameFormat: XDS Active Connections
    "3_2":
      kind: Panel
      spec:
        display:
          name: XDS Requests Size
          description: Shows the size of XDS requests and responses
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes/sec
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: max(rate(envoy_cluster_upstream_cx_rx_bytes_total{cluster_name="xds-grpc"}[$__rate_interval]))
                  seriesNameFormat: XDS Response Bytes Max
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: quantile(0.5, rate(envoy_cluster_upstream_cx_rx_bytes_total{cluster_name="xds-grpc"}[$__rate_interval]))
                  seriesNameFormat: XDS Response Bytes Average
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: max(rate(envoy_cluster_upstream_cx_tx_bytes_total{cluster_name="xds-grpc"}[$__rate_interval]))
                  seriesNameFormat: XDS Request Bytes Max
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: quantile(.5, rate(envoy_cluster_upstream_cx_tx_bytes_total{cluster_name="xds-grpc"}[$__rate_interval]))
                  seriesNameFormat: XDS Request Bytes Average
    "4_0":
      kind: Panel
      spec:
        display:
          name: Configuration Validation
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(galley_validation_passed{pod=~"$istiod"} - galley_validation_passed{pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Validations (Success)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: sum(clamp_min(galley_validation_failed{pod=~"$istiod"} - galley_validation_failed{pod=~"$istiod"} offset $__interval, 0))
                  seriesNameFormat: Validation (Failure)
    "4_1":
      kind: Panel
      spec:
        display:
          name: Sidecar Injection
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: (sum(rate(sidecar_injection_success_total{pod=~"$istiod"}[$__rate_interval]))) or absent(sidecar_injection_success_total{pod=~"$istiod"})-1
                  seriesNameFormat: Injections (Success)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: (sum(rate(sidecar_injection_failure_total{pod=~"$istiod"}[$__rate_interval]))) or absent(sidecar_injection_failure_total{pod=~"$istiod"})-1
                  seriesNameFormat: Injections (Failure)
  layouts:
    - kind: Grid
      spec:
        display:
          title: Deployed Versions
          collapse:
            open: true
        items:
          - x: 0
            "y": 1
            width: 24
            height: 5
            content:
              $ref: '#/spec/panels/0_0'
    - kind: Grid
      spec:
        display:
          title: Resource Usage
          collapse:
            open: true
        items:
          - x: 0
            "y": 7
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/1_0'
          - x: 8
            "y": 7
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/1_1'
          - x: 16
            "y": 7
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/1_2'
          - x: 16
            "y": 7
            width: 8
            height: 7
            content:
              $ref: '#/spec/panels/1_3'
    - kind: Grid
      spec:
        display:
          title: Pilot Push Information
          collapse:
            open: true
        items:
          - x: 0
            "y": 15
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/2_0'
          - x: 8
            "y": 15
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/2_1'
          - x: 16
            "y": 15
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/2_2'
          - x: 0
            "y": 23
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_3'
          - x: 12
            "y": 23
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_4'
    - kind: Grid
      spec:
        display:
          title: Envoy Information
          collapse:
            open: true
        items:
          - x: 0
            "y": 32
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/3_0'
          - x: 8
            "y": 32
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/3_1'
          - x: 16
            "y": 32
            width: 8
            height: 8
            content:
              $ref: '#/spec/panels/3_2'
    - kind: Grid
      spec:
        display:
          title: Webhooks
          collapse:
            open: true
        items:
          - x: 0
            "y": 41
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/4_0'
          - x: 12
            "y": 41
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/4_1'
  duration: 3h
