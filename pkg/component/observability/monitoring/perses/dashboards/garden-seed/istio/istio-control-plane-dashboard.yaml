kind: Dashboard
metadata:
  name: istio-control-plane
  project: garden
spec:
  display:
    name: Istio Control Plane Dashboard
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: DatasourceVariable
          spec:
            datasourcePluginKind: PrometheusDatasource
        name: datasource
    - kind: ListVariable
      spec:
        display:
          name: istiod
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
              - pilot_services{}
        name: istiod
    - kind: ListVariable
      spec:
        display:
          name: Ingress Gateway
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
              - envoy_server_hot_restart_epoch{}
        name: igw
  panels:
