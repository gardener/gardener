kind: Dashboard
metadata:
  name: vpa
  project: garden
spec:
  display:
    name: VPA Recommendations
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Namespace
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .+
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
              - kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu
        name: namespace
    - kind: ListVariable
      spec:
        display:
          name: Kind
          hidden: false
        defaultValue: Deployment
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: target_kind
            matchers:
              - kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{namespace=~"$namespace"}
        name: targetKind
    - kind: ListVariable
      spec:
        display:
          name: Target
          hidden: false
        defaultValue: blackbox-exporter
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: target_name
            matchers:
              - kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{namespace=~"$namespace", target_kind=~"$targetKind"}
        name: targetName
    - kind: ListVariable
      spec:
        display:
          name: Container
          hidden: false
        defaultValue: blackbox-exporter
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: container
            matchers:
              - kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{namespace=~"$namespace", target_kind=~"$targetKind",target_name=~"$targetName"}
        name: container
    - kind: ListVariable
      spec:
        display:
          name: Deviation Duration
          hidden: false
        defaultValue: "30"
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - label: 1m
                value: "1"
              - label: 5m
                value: "5"
              - label: 10m
                value: "10"
              - label: 15m
                value: "15"
              - label: 30m
                value: "30"
              - label: 1h
                value: "60"
              - label: 6h
                value: "360"
              - label: 12h
                value: "720"
              - label: 1d
                value: "1440"
        name: deviationDuration
    - kind: ListVariable
      spec:
        display:
          name: Deviation Tolerance
          hidden: false
        defaultValue: "0.2"
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - "0"
              - "0.2"
              - "0.4"
              - "0.6"
              - "0.8"
        name: deviationTolerance
  panels:
    "0":
      kind: Panel
      spec:
        display:
          name: Update mode
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            metricLabel: update_mode
            sparkline: {}
            thresholds:
              steps:
                - color: '#f2495c'
                  value: 80
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum({__name__=~"kube_customresource_verticalpodautoscaler_spec_updatepolicy_updatemode", namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName"}) by (update_mode) > 0
                  seriesNameFormat: '{{update_mode}}'
    "1":
      kind: Panel
      spec:
        display:
          name: Memory recommendation vs Memory Usage
          description: Shows the recommendations that the VPA gives as target usage. The graph also shows the actual usage of each container.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: container_memory_working_set_bytes{namespace=~"$namespace",pod=~"(?i:$targetKind-)?$targetName(.+)", container=~"$container"}
                  seriesNameFormat: '{{pod}} actual usage'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: target
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: lower bound
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: upper bound
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_spec_resourcepolicy_containerpolicies_minallowed_memory{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: min allowed
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_spec_resourcepolicy_containerpolicies_maxallowed_memory{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: max allowed
    "2":
      kind: Panel
      spec:
        display:
          name: Memory Recommendations vs Requests and Limits
          description: "Shows the recommendation of the VPA and compares it to the requests and limits of all containers in a pod. \n\n**Requests and/or limits may not reflect useful values if they are not defined for each container in a pod."
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_pod_container_resource_requests{namespace=~"$namespace",resource="memory", unit="byte", pod=~"(?i:$targetKind-)?$targetName(.+)",  container=~"$container"}
                  seriesNameFormat: '{{pod}} requests'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_pod_container_resource_limits{namespace=~"$namespace",resource="memory", unit="byte", pod=~"(?i:$targetKind-)?$targetName(.+)",  container=~"$container"}
                  seriesNameFormat: '{{pod}} limits'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container"}
                  seriesNameFormat: recommendation
    "3":
      kind: Panel
      spec:
        display:
          name: CPU recommendation vs CPU Usage
          description: Shows the recommendations that the VPA gives as target usage. The graph also shows the actual usage of each container.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(container_cpu_usage_seconds_total{namespace=~"$namespace",pod=~"(?i:$targetKind-)?$targetName-(.+)",container=~"$container"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{pod}} actual usage'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: target
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: lower bound
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: upper bound
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_spec_resourcepolicy_containerpolicies_minallowed_cpu{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: min allowed
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_spec_resourcepolicy_containerpolicies_maxallowed_cpu{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container|\\*"}
                  seriesNameFormat: max allowed
    "4":
      kind: Panel
      spec:
        display:
          name: CPU Recommendations vs Requests and Limits
          description: "Shows the recommendation of the VPA and compares it to the requests and limits of all containers in a pod. \n\n**Requests and/or limits may not reflect useful values if they are not defined for each container in a pod."
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_pod_container_resource_requests{resource="cpu", unit="core", pod=~"(?i:$targetKind-)?$targetName(.+)",  container=~"$container"}
                  seriesNameFormat: '{{pod}} requests'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_pod_container_resource_limits{resource="cpu", unit="core", pod=~"(?i:$targetKind-)?$targetName(.+)",  container=~"$container"}
                  seriesNameFormat: '{{pod}} limits'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{namespace=~"$namespace", target_kind=~"$targetKind", target_name=~"$targetName", container=~"$container"}
                  seriesNameFormat: 'recommendation '
    "5":
      kind: Panel
      spec:
        display:
          name: 'Continuous Underutilization '
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    sum(sum_over_time(
                      (
                        sum by (pod, cluster, namespace) (
                          rate(container_cpu_usage_seconds_total{
                          namespace=~"$namespace",pod=~"(?i:$targetKind-)?$targetName-(.+)",container=~"$container"}[5m])
                        )
                        < bool on(cluster, namespace)
                        group_left
                        kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{
                          namespace=~"$namespace",target_kind=~"$targetKind",target_name=~"$targetName",container=~"$container"
                        } * (1 - $deviationTolerance)
                      )[${deviationDuration:text}:1m]
                    ) >= bool $deviationDuration)
                  seriesNameFormat: Sum of $targetName targets using less than VPA recommendation with a minimum duration of ${deviationDuration:text} and a tolerance of $deviationTolerance
    "6":
      kind: Panel
      spec:
        display:
          name: 'Continuous Overutilization '
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    sum(sum_over_time(
                      (
                        sum by (pod, cluster, namespace) (
                          rate(container_cpu_usage_seconds_total{
                          namespace=~"$namespace",pod=~"(?i:$targetKind-)?$targetName-(.+)",container=~"$container"}[5m])
                        )
                        > bool on(cluster, namespace)
                        group_left
                        kube_customresource_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{
                          namespace=~"$namespace",target_kind=~"$targetKind",target_name=~"$targetName",container=~"$container"
                        } * (1 + $deviationTolerance)
                      )[${deviationDuration:text}:1m]
                    ) >= bool $deviationDuration)
                  seriesNameFormat: Sum of $targetName targets using more than VPA recommendation with a minimum duration of ${deviationDuration:text} and a tolerance of $deviationTolerance
  layouts:
    - kind: Grid
      spec:
        display:
          title: Panel Group 1
        items:
          - x: 0
            "y": 0
            width: 24
            height: 2
            content:
              $ref: '#/spec/panels/0'
          - x: 0
            "y": 2
            width: 12
            height: 13
            content:
              $ref: '#/spec/panels/1'
          - x: 12
            "y": 2
            width: 12
            height: 13
            content:
              $ref: '#/spec/panels/2'
          - x: 0
            "y": 15
            width: 12
            height: 13
            content:
              $ref: '#/spec/panels/3'
          - x: 12
            "y": 15
            width: 12
            height: 13
            content:
              $ref: '#/spec/panels/4'
          - x: 0
            "y": 28
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/5'
          - x: 12
            "y": 28
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/6'
  duration: 1h
