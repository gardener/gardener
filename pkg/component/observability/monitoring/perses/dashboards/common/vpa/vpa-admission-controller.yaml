kind: Dashboard
metadata:
  name: vpa-admission-controller
  project: garden
spec:
  display:
    name: VPA Admission Controller
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue: seed-prometheus
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: DatasourceVariable
          spec:
            datasourcePluginKind: PrometheusDatasource
        name: datasource
  panels:
    "0":
      kind: Panel
      spec:
        display:
          name: Admitted Pods rate
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: list
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(vpa_admission_controller_admission_pods_total[$__rate_interval])) by (applied)
                  seriesNameFormat: Applied recommendation "{{ applied }}"
    "1":
      kind: Panel
      spec:
        display:
          name: Execution latency step=total
        plugin:
          kind: Markdown
          spec:
            text: '**Migration from Grafana not supported !**'
        queries: []
    "2":
      kind: Panel
      spec:
        display:
          name: Total admission time for Pods
        plugin:
          kind: Markdown
          spec:
            text: '**Migration from Grafana not supported !**'
        queries: []
    "3":
      kind: Panel
      spec:
        display:
          name: Total admission time for VPAs
        plugin:
          kind: Markdown
          spec:
            text: '**Migration from Grafana not supported !**'
        queries: []
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            "y": 0
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0'
          - x: 12
            "y": 0
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/1'
          - x: 12
            "y": 9
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/2'
          - x: 12
            "y": 18
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/3'
  duration: 6h
