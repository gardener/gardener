kind: Dashboard
metadata:
  name: controller-details
  project: garden
spec:
  display:
    name: Controller Runtime / Controller Details
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue: seed-prometheus
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: DatasourceVariable
          spec:
            datasourcePluginKind: PrometheusDatasource
        name: datasource
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue: gardenlet
        allowAllValue: false
        allowMultiple: false
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: job
            matchers:
              - controller_runtime_reconcile_total{}
        name: job
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: pod
            matchers:
              - controller_runtime_reconcile_total{job="$job"}
        name: pod
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue: backupbucket
        allowAllValue: false
        allowMultiple: false
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: controller
            matchers:
              - controller_runtime_reconcile_total{job="$job",pod=~"$pod"}
        name: controller
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Reconciliation Rate by pod
          description: Shows the reconciliation rate for a controller by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_total{job="$job",controller=~"$controller",pod=~"$pod"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{pod}}'
    "0_1":
      kind: Panel
      spec:
        display:
          name: Reconciliation Rate by result
          description: Shows the reconciliation rate per result per controller by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_total{job="$job",controller=~"$controller",pod=~"$pod"}[$__rate_interval])) by (result)
                  seriesNameFormat: '{{result}}'
    "0_2":
      kind: Panel
      spec:
        display:
          name: Error Rate by pod
          description: Shows the total number of reconciliation errors per controller by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                decimalPlaces: 3
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_errors_total{job="$job",controller=~"$controller",pod=~"$pod"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{pod}}'
    "0_3":
      kind: Panel
      spec:
        display:
          name: Reconciliation time (P50, P90, P99)
          description: Shows percentiles of the reconciliation duration.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.5, sum(rate(controller_runtime_reconcile_time_seconds_bucket{job="$job",controller=~"$controller",pod=~"$pod"}[$__rate_interval])) by (controller,le))
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.9, sum(rate(controller_runtime_reconcile_time_seconds_bucket{job="$job",controller=~"$controller",pod=~"$pod"}[$__rate_interval])) by (controller,le))
                  seriesNameFormat: P90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(controller_runtime_reconcile_time_seconds_bucket{job="$job",controller=~"$controller",pod=~"$pod"}[$__rate_interval])) by (controller,le))
                  seriesNameFormat: P99
    "0_4":
      kind: Panel
      spec:
        display:
          name: Reconciliation Timeout by pod
          description: Shows the reconciliation timeouts for a controller by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineStyle: solid
              lineWidth: 1
            yAxis:
              format:
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_timeouts_total{job="$job",pod=~"$pod",controller="$controller"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{pod}}'
    "1_0":
      kind: Panel
      spec:
        display:
          name: Active Controller Workers by pod
          description: Shows the active workers per controller by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            querySettings:
              - areaOpacity: 0
                colorMode: fixed
                colorValue: '#f2495c'
                queryIndex: 1
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                decimalPlaces: 0
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(controller_runtime_active_workers{job="$job",controller=~"$controller",pod=~"$pod"}) by (pod)
                  seriesNameFormat: '{{pod}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: max(controller_runtime_max_concurrent_reconciles{job="$job",controller=~"$controller",pod=~"$pod"})
                  seriesNameFormat: Max
    "1_1":
      kind: Panel
      spec:
        display:
          name: Total workers by pod
          description: Shows the maximum number of concurrent reconciliations per controller by pod.
        plugin:
          kind: Table
          spec:
            columnSettings:
              - name: value
                width: 80
              - hide: true
                name: timestamp
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(controller_runtime_max_concurrent_reconciles{job="$job",controller=~"$controller",pod=~"$pod"}) by (pod)
                  seriesNameFormat: ""
    "1_2":
      kind: Panel
      spec:
        display:
          name: Unfinished Work by pod
          description: Rate of unfinished work per second not observed in work duration metrics. A constant value of 1 could indicate 1 stuck worker routine.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              max: 2
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(workqueue_unfinished_work_seconds{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{pod}}'
    "1_3":
      kind: Panel
      spec:
        display:
          name: Longest Running Worker by pod
          description: Shows for how many seconds the longest running worker of a pod for a workqueue has been running.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: max(workqueue_longest_running_processor_seconds{job="$job",pod=~"$pod",name="$controller"}) by (pod)
                  seriesNameFormat: '{{name}}'
    "2_0":
      kind: Panel
      spec:
        display:
          name: Enqueue Rate by  pod
          description: Shows the rate of adds to the work queue. by pod
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                decimalPlaces: 3
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(workqueue_adds_total{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{name}}'
    "2_1":
      kind: Panel
      spec:
        display:
          name: Retry Rate by pod
          description: Shows the total number of retries handled by the workqueue by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                decimalPlaces: 3
                unit: ops/sec
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(rate(workqueue_retries_total{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (pod)
                  seriesNameFormat: '{{name}}'
    "2_2":
      kind: Panel
      spec:
        display:
          name: Queue Duration (P50, P90, P99)
          description: Seconds an item stays in workqueue before being requested.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineStyle: solid
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.5, sum(rate(workqueue_queue_duration_seconds_bucket{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (name,le))
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.9, sum(rate(workqueue_queue_duration_seconds_bucket{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (name,le))
                  seriesNameFormat: P90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(workqueue_queue_duration_seconds_bucket{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (name,le))
                  seriesNameFormat: P99
    "2_3":
      kind: Panel
      spec:
        display:
          name: Work Duration (P50, P90, P99)
          description: Seconds processing an item from workqueue takes.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineStyle: solid
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.5, sum(rate(workqueue_work_duration_seconds_bucket{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (name,le))
                  seriesNameFormat: P50
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.9, sum(rate(workqueue_work_duration_seconds_bucket{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (name,le))
                  seriesNameFormat: P90
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: histogram_quantile(0.99, sum(rate(workqueue_work_duration_seconds_bucket{job="$job",pod=~"$pod",name="$controller"}[$__rate_interval])) by (name,le))
                  seriesNameFormat: P99
    "2_4":
      kind: Panel
      spec:
        display:
          name: Queue Length by pod
          description: Shows the current length of the workqueue by pod.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: ${datasource}
                  minStep: ""
                  query: sum(workqueue_depth{job="$job",pod=~"$pod",name="$controller"}) by (pod)
                  seriesNameFormat: '{{pod}}'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Reconciliations
          collapse:
            open: true
        items:
          - x: 0
            "y": 1
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0_0'
          - x: 12
            "y": 1
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0_1'
          - x: 0
            "y": 10
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0_2'
          - x: 12
            "y": 10
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0_3'
          - x: 0
            "y": 19
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/0_4'
    - kind: Grid
      spec:
        display:
          title: Workers
          collapse:
            open: true
        items:
          - x: 0
            "y": 28
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/1_0'
          - x: 12
            "y": 28
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/1_1'
          - x: 0
            "y": 36
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/1_2'
          - x: 12
            "y": 36
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/1_3'
    - kind: Grid
      spec:
        display:
          title: Work Queue
          collapse:
            open: true
        items:
          - x: 0
            "y": 45
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_0'
          - x: 12
            "y": 45
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_1'
          - x: 0
            "y": 53
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_2'
          - x: 12
            "y": 53
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_3'
          - x: 0
            "y": 61
            width: 12
            height: 8
            content:
              $ref: '#/spec/panels/2_4'
  duration: 1h
  refreshInterval: 30s
