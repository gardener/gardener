                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum without(shoot_uid) (metering:memory_usage:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace",owner=~"$owner",container=~"$container"})
                  seriesNameFormat: '{{owner}} / {{container}}'
    "2_1":
      kind: Panel
      spec:
        display:
          name: Working Set Memory usage
        plugin:
          kind: TimeSeriesChart
          spec:
