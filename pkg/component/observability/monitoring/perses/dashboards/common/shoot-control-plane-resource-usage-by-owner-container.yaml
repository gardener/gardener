kind: Dashboard
metadata:
  name: shoot-control-plane-resource-usage-by-owner-container
  project: garden
spec:
  display:
    name: Shoot control plane resource usage by owner and container
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue: shoot--local--local
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
              - metering:working_set_memory:sum_by_namespace{shoot_uid!=""}
        name: namespace
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: owner
            matchers:
              - metering:working_set_memory:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace"}
        name: owner
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: container
            matchers:
              - metering:working_set_memory:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace",owner=~"$owner"}
        name: container
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Shoot UID
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            metricLabel: shoot_uid
            sparkline: {}
            thresholds:
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: '{{shoot_uid}}'
    "0_1":
      kind: Panel
      spec:
        display:
          name: Elapsed usage time in the current calendar month
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            format:
              unit: seconds
            sparkline: {}
            thresholds:
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:memory_usage_seconds{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: CPU, Memory, Network usage time in {{year}}/{{month}} 
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:disk_usage_seconds{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Disk usage time in {{year}}/{{month}} 
    "0_2":
      kind: Panel
      spec:
        display:
          name: Average resource usage in the current calendar month when the cluster was active
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            format:
              unit: decimal
            sparkline: {}
            thresholds:
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: CPU usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_requests:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: CPU requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:memory_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Memory usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:working_set_memory:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Working Set Memory usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:memory_requests:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Memory requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:persistent_volume_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Disk usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:persistent_volume_claims:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Disk requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:network_receive:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"} + metering:network_transmit:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Network
    "0_3":
      kind: Panel
      spec:
        display:
          name: Current resource usage
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            format:
              unit: decimal
            sparkline: {}
            thresholds:
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_usage:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: CPU usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_requests:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: CPU requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:memory_usage:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Memory usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:working_set_memory:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Working Set Memory usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:memory_requests:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Memory requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:persistent_volume_usage:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Disk usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:persistent_volume_claims:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Disk requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:network_receive:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"} + metering:network_transmit:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Network
    "1_0":
      kind: Panel
      spec:
        display:
          name: CPU usage
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
                - last
                - mean
                - max
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_usage:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Total {{shoot_uid}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum without(shoot_uid) (metering:cpu_usage:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace",owner=~"$owner",container=~"$container"})
                  seriesNameFormat: '{{owner}} / {{container}}'
    "1_1":
      kind: Panel
      spec:
        display:
          name: CPU requests
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
                - last
                - mean
                - max
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:cpu_requests:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Total {{shoot_uid}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
