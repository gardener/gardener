  layouts:
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
          - x: 0
            "y": 1
            width: 8
            height: 2
            content:
              $ref: '#/spec/panels/0_0'
          - x: 8
            "y": 1
            width: 16
            height: 2
            content:
              $ref: '#/spec/panels/0_1'
          - x: 0
            "y": 3
            width: 24
            height: 4
            content:
              $ref: '#/spec/panels/0_2'
          - x: 0
            "y": 7
            width: 24
            height: 4
            content:
              $ref: '#/spec/panels/0_3'
    - kind: Grid
      spec:
        display:
          title: CPU
          collapse:
            open: true
        items:
          - x: 0
            "y": 12
            width: 12
            height: 13
            content:
              $ref: '#/spec/panels/1_0'
          - x: 12
            "y": 12
            width: 12
            height: 13
            content:
              $ref: '#/spec/panels/1_1'
    - kind: Grid
