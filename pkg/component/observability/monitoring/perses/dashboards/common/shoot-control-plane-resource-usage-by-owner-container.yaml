                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum without(shoot_uid) (metering:cpu_requests:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace",owner=~"$owner",container=~"$container"})
                  seriesNameFormat: '{{owner}} / {{container}}'
    "2_0":
      kind: Panel
      spec:
        display:
          name: Memory usage
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decbytes
            legend:
              position: bottom
              mode: table
              values:
                - last
                - mean
                - max
        queries:
          - kind: TimeSeriesQuery
