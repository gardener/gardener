        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:working_set_memory:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Total {{shoot_uid}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum without(shoot_uid) (metering:working_set_memory:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace",owner=~"$owner",container=~"$container"})
                  seriesNameFormat: '{{owner}} / {{container}}'
    "2_2":
      kind: Panel
      spec:
        display:
          name: Memory requests
        plugin:
