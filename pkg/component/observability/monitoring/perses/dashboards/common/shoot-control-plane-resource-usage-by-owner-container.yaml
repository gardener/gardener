                  minStep: ""
                  query: sum without(shoot_uid) (metering:memory_requests:sum_by_namespace_owner_container{shoot_uid!="",namespace=~"$namespace",owner=~"$owner",container=~"$container"})
                  seriesNameFormat: '{{owner}} / {{container}}'
    "3_0":
      kind: Panel
      spec:
        display:
          name: Network Receive
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes/sec
            legend:
              position: bottom
              mode: table
              values:
                - last
                - mean
                - max
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: metering:network_receive:sum_by_namespace{shoot_uid!="",namespace=~"$namespace"}
                  seriesNameFormat: Total {{shoot_uid}}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum without(shoot_uid) (metering:network_receive:sum_by_namespace_owner{shoot_uid!="",namespace=~"$namespace",owner=~"$owner"})
                  seriesNameFormat: '{{owner}}'
    "3_1":
      kind: Panel
      spec:
        display:
          name: Network Transmit
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes/sec
            legend:
              position: bottom
              mode: table
              values:
                - last
                - mean
