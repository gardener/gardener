kind: Dashboard
metadata:
  name: pod-logs
  project: garden
spec:
  display:
    name: Pod Logs
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Log Volume
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: VictoriaLogsTimeSeriesQuery
                spec:
                  datasource:
                    kind: VictoriaLogsDatasource
                    name: victorialogs
                  query: '{k8s.pod.name=~"$pod"} $search | stats count() logs'
    "1_0":
      kind: Panel
      spec:
        display:
          name: Logs Panel
        plugin:
          kind: LogsTable
          spec:
            enableDetails: true
            showTime: true
        queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: VictoriaLogsLogQuery
                spec:
                  datasource:
                    kind: VictoriaLogsDatasource
                    name: victorialogs
                  query: '{k8s.pod.name=~"$pod"} $search'
  layouts:
    - kind: Grid
      spec:
        display:
          title: ""
          collapse:
            open: true
        items:
          - x: 0
            "y": 0
            width: 24
            height: 3
            content:
              $ref: "#/spec/panels/0_0"
          - x: 0
            "y": 3
            width: 24
            height: 25
            content:
              $ref: "#/spec/panels/1_0"
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Pod
          hidden: false
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-asc
        plugin:
          kind: VictoriaLogsFieldValuesVariable
          spec:
            datasource:
              kind: VictoriaLogsDatasource
              name: victorialogs
            field: k8s.pod.name
            query: "*"
        name: pod
    - kind: TextVariable
      spec:
        display:
          name: Search
          hidden: false
        value: ""
        name: search
  annotations: []
  duration: 1h
  refreshInterval: 0s
  links: []
