kind: Dashboard
metadata:
  name: alerts
  project: garden
spec:
  display:
    name: Alerts
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        allowAllValue: false
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: project
            matchers:
              - ALERTS
        name: Project
    - kind: ListVariable
      spec:
        display:
          hidden: false
        allowAllValue: false
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: name
            matchers:
              - ALERTS{project=~"$Project"}
        name: Shoot
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: severity
            matchers: []
        name: Severity
    - kind: ListVariable
      spec:
        display:
          name: Alert State
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: alertstate
            matchers: []
        name: AlertState
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: alertname
            matchers: []
        name: Alertname
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Firing Alerts
          description: Shows how many alerts are currently firing for shoots using this seed.
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(ALERTS{alertstate="firing"})
    "0_1":
      kind: Panel
      spec:
        display:
          name: Clusters with Firing Alerts
          description: Shows how many clusters have at least 1 firing alert.
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(count(ALERTS{alertstate="firing"}) by (cluster))
                  seriesNameFormat: ""
    "0_2":
      kind: Panel
      spec:
        display:
          name: Pending Alerts
          description: Shows how many alerts are currently pending for shoots using this seed.
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(ALERTS{alertstate="pending"})
    "0_3":
      kind: Panel
      spec:
        display:
          name: Clusters with Pending Alerts
          description: Shows how many clusters currently have at least 1 pending alert.
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(count(ALERTS{alertstate="pending"}) by (cluster))
                  seriesNameFormat: ""
    "0_4":
      kind: Panel
      spec:
        display:
          name: '% of Clusters with Alerts'
          description: Shows the percentage of clusters that have at least 1 firing or pending alert.
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(count(ALERTS) by (cluster)) / sum(seed:active_shoots_total:sum) * 100
    "0_5":
      kind: Panel
      spec:
        display:
          name: Clusters Total
          description: Shows the total number of shoots with a control plane on this seed.
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: seed:active_shoots_total:sum
                  seriesNameFormat: ""
    "0_6":
      kind: Panel
      spec:
        display:
          name: Active Alert Count ($Severity/$AlertState)
          description: Shows the count of alerts with selected severity and alert state from all clusters.
        plugin:
          kind: Table
          spec:
            columnSettings: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(ALERTS{severity=~"$Severity", alertstate=~"$AlertState"}) by (alertname)
                  seriesNameFormat: ""
    "0_7":
      kind: Panel
      spec:
        display:
          name: Cluster Alerts ($Severity/$AlertState)
          description: Shows all alerts that are currently active from the selected clusters, severity, and alert state.
        plugin:
          kind: Table
          spec:
            columnSettings: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(ALERTS{project=~"$Project",name=~"$Shoot", severity=~"$Severity", alertstate=~"$AlertState"}) by (alertname, project, name, severity, alertstate)
                  seriesNameFormat: ""
    "1_0":
      kind: Panel
      spec:
        display:
          name: Cluster Alert Count ($Severity/$AlertState)
          description: Shows the number of ($Severity) alerts in Alert State ($AlertState) for the selected clusters.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: right
              mode: table
              values:
                - last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(ALERTS{alertname=~"$Alertname", severity=~"$Severity", alertstate=~"$AlertState", project=~"$Project", name=~"$Shoot"}) by (name,project)
                  seriesNameFormat: '{{ project }}/{{ name }}'
    "1_1":
      kind: Panel
      spec:
        display:
          name: Active Alerts ($Severity/$AlertState)
          description: Shows alerts that are/were active with the selected severity and alert state from the selected clusters. Includes the alertnames of the alerts.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: right
              mode: table
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  query: count(ALERTS{alertname=~"$Alertname", severity=~"$Severity", alertstate=~"$AlertState", project=~"$Project", name=~"$Shoot"}) by (alertname,project,name)
                  seriesNameFormat: '{{ alertname }}/{{ project }}/{{ name }}'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Active Alerts Overview
          collapse:
            open: true
        items:
          - x: 0
            "y": 1
            width: 4
            height: 4
            content:
              $ref: '#/spec/panels/0_0'
          - x: 4
            "y": 1
            width: 4
            height: 4
            content:
              $ref: '#/spec/panels/0_1'
          - x: 8
            "y": 1
            width: 4
            height: 4
            content:
              $ref: '#/spec/panels/0_2'
          - x: 12
            "y": 1
            width: 4
            height: 4
            content:
              $ref: '#/spec/panels/0_3'
          - x: 16
            "y": 1
            width: 4
            height: 4
            content:
              $ref: '#/spec/panels/0_4'
          - x: 20
            "y": 1
            width: 4
            height: 4
            content:
              $ref: '#/spec/panels/0_5'
          - x: 0
            "y": 5
            width: 24
            height: 8
            content:
              $ref: '#/spec/panels/0_6'
          - x: 0
            "y": 13
            width: 24
            height: 10
            content:
              $ref: '#/spec/panels/0_7'
    - kind: Grid
      spec:
        display:
          title: Alerts by Cluster
          collapse:
            open: true
        items:
          - x: 0
            "y": 24
            width: 24
            height: 9
            content:
              $ref: '#/spec/panels/1_0'
          - x: 0
            "y": 33
            width: 24
            height: 9
            content:
              $ref: '#/spec/panels/1_1'
  duration: 1h
