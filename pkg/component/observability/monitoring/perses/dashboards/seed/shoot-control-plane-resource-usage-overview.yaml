kind: Dashboard
metadata:
  name: shoot-control-plane-resource-usage-overview
  project: garden
spec:
  display:
    name: Shoot control plane resource usage overview
  variables:
    - kind: ListVariable
      spec:
        display:
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
              - metering:working_set_memory:sum_by_namespace{shoot_uid!=""}
        name: namespace
  panels:
    "0":
      kind: Panel
      spec:
        display:
          name: Shoot Cluster Count
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            sparkline: {}
            thresholds:
              steps: []
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: count(metering:memory_usage_seconds{shoot_uid!=""})
                  seriesNameFormat: Current
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: count(metering:memory_usage_seconds:this_month{shoot_uid!=""}) by (year, month)
                  seriesNameFormat: Total in {{year}}/{{month}}
    "1":
      kind: Panel
      spec:
        display:
          name: Average CPU Usage per Shoot Cluster
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
            colorMode: value
            sparkline: {}
            thresholds:
              steps:
                - color: '#f2495c'
                  value: 80
            format:
              unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    min(
                        (metering:cpu_usage:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Minimum
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    quantile(0.5,
                        (metering:cpu_usage:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Median
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    max(
                        (metering:cpu_usage:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Maximum
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    avg(
                        (metering:cpu_usage:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Average
    "2":
      kind: Panel
      spec:
        display:
          name: Average Memory Usage per Shoot Cluster
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
