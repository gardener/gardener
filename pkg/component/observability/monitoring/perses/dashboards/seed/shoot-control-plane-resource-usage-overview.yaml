                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:working_set_memory:sum_by_namespace:avg_over_time:this_month{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: Working Set Memory usage
          - kind: TimeSeriesQuery
