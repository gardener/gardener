        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    min(
                        (metering:network_receive:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""}
                         +
                         metering:network_transmit:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Minimum
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    quantile(0.5,
                        (metering:network_receive:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""}
                         +
                         metering:network_transmit:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Median
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    max(
                        (metering:network_receive:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""}
                         +
                         metering:network_transmit:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
                        0 * (metering:memory_usage_seconds:this_month > 300)
                    )
                  seriesNameFormat: Maximum
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    avg(
                        (metering:network_receive:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""}
                         +
