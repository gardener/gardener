                    )
                  seriesNameFormat: Maximum
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: |-
                    avg(
                        (metering:working_set_memory:sum_by_namespace:avg_over_time:this_month{shoot_uid!=""} > 0)
                      +
