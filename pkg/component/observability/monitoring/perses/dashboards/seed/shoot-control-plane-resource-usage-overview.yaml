                    )
                  seriesNameFormat: Average
    "5":
      kind: Panel
      spec:
        display:
          name: Average monthly shoot resource usage of currently existing shoot clusters
          description: 'Note: Memory usage time is identical to the CPU and Network usage time. For simplicity''s sake, only memory usage time is listed in this table.'
        plugin:
          kind: Table
          spec:
            columnSettings:
              - name: shoot_uid
                width: 292
              - name: namespace
              - header: Memory Usage Time
                name: 'value #9'
              - header: Disk Usage Time
                name: 'value #10'
              - header: CPU Usage
                name: 'value #1'
              - header: CPU Requests
                name: 'value #2'
              - header: Working Set Memory Usage
                name: 'value #3'
                width: 224
              - header: Memory Usage
                name: 'value #4'
              - header: Memory Requests
                name: 'value #5'
              - header: Disk Usage
                name: 'value #6'
              - header: Disk Requests
                name: 'value #7'
              - header: Network
                name: 'value #8'
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (namespace, shoot_uid) (metering:cpu_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: CPU usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:cpu_requests:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: CPU requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:working_set_memory:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: Working Set Memory usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:memory_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: Memory Usage
