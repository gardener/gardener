                  seriesNameFormat: Memory requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:persistent_volume_usage:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: Disk usage
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:persistent_volume_claims:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: Disk requests
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum by (shoot_uid) (metering:network_receive:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"} + metering:network_transmit:sum_by_namespace:avg_over_time{shoot_uid!="",namespace=~"$namespace"})
                  seriesNameFormat: Network
          - kind: TimeSeriesQuery
            spec:
              plugin:
