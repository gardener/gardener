kind: Dashboard
metadata:
  name: extensions
  project: garden
spec:
  display:
    name: Extensions
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Container
          hidden: false
        allowAllValue: false
        allowMultiple: false
        sort: alphabetical-asc
        plugin:
          kind: VictoriaLogsFieldValuesVariable
          spec:
            datasource:
              kind: VictoriaLogsDatasource
              name: victorialogs
            field: k8s.container.name
            query: '*'
        name: container
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: CPU Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-aggregate
                  query: sum(seed:container_cpu_usage_seconds_total:sum_by_container{container="$container"}) by (container)
                  seriesNameFormat: '{{ container }}'
    "0_1":
      kind: Panel
      spec:
        display:
          name: Memory Usage
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
            legend:
              position: bottom
              mode: list
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-aggregate
                  query: sum(seed:container_memory_working_set_bytes:sum_by_container{container="$container"}) by (container)
                  seriesNameFormat: '{{ container }}'
    "1_0":
      kind: Panel
      spec:
        display:
          name: Logs
        plugin:
          kind: LogsTable
          spec:
            showTime: true
            enableDetails: true
        queries:
          - kind: LogQuery
            spec:
              plugin:
                kind: VictoriaLogsLogQuery
                spec:
                  datasource:
                    kind: VictoriaLogsDatasource
                    name: victorialogs
                  query: '{k8s.container.name=~"$container"}'
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            "y": 0
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0_0'
          - x: 12
            "y": 0
            width: 12
            height: 9
            content:
              $ref: '#/spec/panels/0_1'
          - x: 0
            "y": 9
            width: 24
            height: 11
            content:
              $ref: '#/spec/panels/1_0'
        display:
          title: ""
          collapse:
            open: true
  duration: 1h
  annotations: []
  refreshInterval: 0s
  links: []
