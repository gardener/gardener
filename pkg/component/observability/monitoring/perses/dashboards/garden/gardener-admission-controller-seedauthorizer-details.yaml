kind: Dashboard
metadata:
  name: gardener-admission-controller-seedauthorizer-details
  project: garden
spec:
  display:
    name: Gardener Admission Controller (SeedAuthorizer Details)
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Update Kind
          description: Object kind for the update duration per seconds
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: kind
            matchers:
              - gardener_admission_controller_seed_authorizer_graph_update_duration_seconds_bucket
        name: kind
    - kind: ListVariable
      spec:
        display:
          name: Path Check Kind
          description: Object kind for the path check duration per seconds
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        sort: alphabetical-asc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: fromKind
            matchers:
              - gardener_admission_controller_seed_authorizer_graph_path_check_duration_seconds_bucket
        name: from_kind
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: $kind
        plugin:
          kind: Markdown
          spec:
            text: '**Migration from Grafana not supported !**'
    "1_0":
      kind: Panel
      spec:
        display:
          name: $from_kind
        plugin:
          kind: Markdown
          spec:
            text: '**Migration from Grafana not supported !**'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Graph Update Duration Per Kind
          collapse:
            open: false
        items:
          - x: 0
            "y": 1
            width: 6
            height: 8
            content:
              $ref: '#/spec/panels/0_0'
    - kind: Grid
      spec:
        display:
          title: Graph Path Check Duration Per FromKind
          collapse:
            open: false
        items:
          - x: 0
            "y": 2
            width: 6
            height: 8
            content:
              $ref: '#/spec/panels/1_0'
  duration: 30m
