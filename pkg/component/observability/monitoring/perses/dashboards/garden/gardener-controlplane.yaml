kind: Dashboard
metadata:
  name: gardener-controlplane
  project: garden
spec:
  display:
    name: Gardener Control Plane
  variables:
    - kind: ListVariable
      spec:
        display:
          name: Job
          description: Native controller-runtime Gardener Control Plane Components
          hidden: false
        defaultValue: gardener-controller-manager
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - gardener-controller-manager
              - gardener-scheduler
        name: job
    - kind: ListVariable
      spec:
        display:
          name: Reconciliation Result
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: result
            matchers:
              - controller_runtime_reconcile_total
        name: result
    - kind: ListVariable
      spec:
        display:
          name: Response Code
          hidden: false
        defaultValue:
          - $__all
        allowAllValue: true
        allowMultiple: true
        sort: none
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: code
            matchers:
              - rest_client_requests_total
        name: code
    - kind: ListVariable
      spec:
        display:
          name: Percentile
          hidden: false
        defaultValue: "90"
        allowAllValue: false
        allowMultiple: false
        plugin:
          kind: StaticListVariable
          spec:
            values:
              - "90"
              - "95"
              - "99"
        name: percentile
  panels:
    "0_0":
      kind: Panel
      spec:
        display:
          name: Max Concurrent Reconciliations
          description: Shows the maximum number of concurrent reconciliations per controller.
        plugin:
          kind: BarChart
          spec:
            calculation: last-number
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: max(controller_runtime_max_concurrent_reconciles{job="$job"}) by (controller)
                  seriesNameFormat: '{{controller}}'
    "0_1":
      kind: Panel
      spec:
        display:
          name: Active Controller Workers
          description: Shows the active workers per controller.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(controller_runtime_active_workers{job="$job"}) by (controller)
                  seriesNameFormat: '{{controller}}'
    "0_2":
      kind: Panel
      spec:
        display:
          name: Number of Reconciliations For Result "$result"
          description: Shows the total number of reconciliations per controller.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_total{job="$job",result=~"$result"}[$__rate_interval])) by (controller)
                  seriesNameFormat: '{{controller}}'
    "0_3":
      kind: Panel
      spec:
        display:
          name: Reconciliation Errors
          description: Shows the total number of reconciliation errors per controller.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_errors_total{job="$job"}[$__rate_interval])) by (controller)
                  seriesNameFormat: '{{controller}}'
    "0_4":
      kind: Panel
      spec:
        display:
          name: Length of Reconciliation Times (${percentile}th Percentile)
          description: Shows the length per reconciliation per controller.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($percentile/100,sum(rate(controller_runtime_reconcile_time_seconds_bucket{job="$job"}[$__rate_interval])) by(le,controller))
                  seriesNameFormat: '{{controller}}'
    "0_5":
      kind: Panel
      spec:
        display:
          name: Reconciliation Rate
          description: Shows the reconciliation rate per controller.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(controller_runtime_reconcile_time_seconds_count{job="$job"}[$__rate_interval])) by(controller)
                  seriesNameFormat: '{{controller}}'
    "1_0":
      kind: Panel
      spec:
        display:
          name: HTTP Requests For Garden API Server
          description: Shows the total number of HTTP requests.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(rest_client_requests_total{job="$job",code=~"$code"}[$__rate_interval])) by (method)
                  seriesNameFormat: '{{method}}'
    "2_0":
      kind: Panel
      spec:
        display:
          name: Queue Duration (${percentile}th Percentile)
          description: Shows how long an item stays in the workqueue before being requested.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($percentile/100,sum(rate(workqueue_queue_duration_seconds_bucket{job="$job"}[$__rate_interval])) by(le,name))
                  seriesNameFormat: '{{name}}'
    "2_1":
      kind: Panel
      spec:
        display:
          name: Work Duration (${percentile}th Percentile)
          description: Shows how long it takes to process an item.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: histogram_quantile($percentile/100,sum(rate(workqueue_work_duration_seconds_bucket{job="$job"}[$__rate_interval])) by(le,name))
                  seriesNameFormat: '{{name}}'
    "2_2":
      kind: Panel
      spec:
        display:
          name: Work Rate
          description: Shows how many items of the workqueue are processed.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(workqueue_work_duration_seconds_count{job="$job"}[$__rate_interval])) by(name)
                  seriesNameFormat: '{{name}}'
    "2_3":
      kind: Panel
      spec:
        display:
          name: Queue Length
          description: Shows the current length of the workqueue.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(workqueue_depth{job="$job"}) by (name)
                  seriesNameFormat: '{{name}}'
    "2_4":
      kind: Panel
      spec:
        display:
          name: Enqueues
          description: Shows the total number of adds to the work queue.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(workqueue_adds_total{job="$job"}[$__rate_interval])) by (name)
                  seriesNameFormat: '{{name}}'
    "2_5":
      kind: Panel
      spec:
        display:
          name: Retries
          description: Shows the total number of retries handled by the workqueue.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(rate(workqueue_retries_total{job="$job"}[$__rate_interval])) by (name)
                  seriesNameFormat: '{{name}}'
    "2_6":
      kind: Panel
      spec:
        display:
          name: Longest Running Processor
          description: Shows for how many seconds the longest running processor for a workqueue has been running.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(workqueue_longest_running_processor_seconds{job="$job"}) by (name)
                  seriesNameFormat: '{{name}}'
    "2_7":
      kind: Panel
      spec:
        display:
          name: Unfinished Work
          description: Shows for how many seconds of work has been done that is in progress and hasn't been observed by work_duration. Large values indicate stuck threads. One can deduce the number of stuck threads by observing the rate at which this increases.
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                  minStep: ""
                  query: sum(workqueue_unfinished_work_seconds{job="$job"}) by (name)
                  seriesNameFormat: '{{name}}'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Controllers
          collapse:
            open: true
        items:
          - x: 0
            "y": 1
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/0_0'
          - x: 12
            "y": 1
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/0_1'
          - x: 0
            "y": 7
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/0_2'
          - x: 12
            "y": 7
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/0_3'
          - x: 0
            "y": 13
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/0_4'
          - x: 12
            "y": 13
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/0_5'
    - kind: Grid
      spec:
        display:
          title: REST Client
          collapse:
            open: true
        items:
          - x: 0
            "y": 20
            width: 24
            height: 6
            content:
              $ref: '#/spec/panels/1_0'
    - kind: Grid
      spec:
        display:
          title: Workqueues
          collapse:
            open: true
        items:
          - x: 0
            "y": 27
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/2_0'
          - x: 12
            "y": 27
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/2_1'
          - x: 0
            "y": 33
            width: 24
            height: 6
            content:
              $ref: '#/spec/panels/2_2'
          - x: 0
            "y": 39
            width: 24
            height: 6
            content:
              $ref: '#/spec/panels/2_3'
          - x: 0
            "y": 45
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/2_4'
          - x: 12
            "y": 45
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/2_5'
          - x: 0
            "y": 51
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/2_6'
          - x: 12
            "y": 51
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/2_7'
  duration: 1h
