                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-longterm
                  minStep: ""
                  query: 1- quantile(0.9, probe_failure:run:time:total:percent{iaas=~"$iaas",purpose=~"$purpose",project=~"$project",term=~"$term",window="$window"}) by (iaas)
                  seriesNameFormat: '{{iaas}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-longterm
                  minStep: ""
                  query: $SLO/100
                  seriesNameFormat: SLO
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: prometheus-longterm
                  minStep: ""
                  query: "1"
                  seriesNameFormat: 100%
    "3_0":
