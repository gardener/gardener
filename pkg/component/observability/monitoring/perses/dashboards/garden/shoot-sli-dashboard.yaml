  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            "y": 0
            width: 4
            height: 5
            content:
              $ref: '#/spec/panels/0'
          - x: 4
            "y": 0
            width: 20
            height: 5
            content:
              $ref: '#/spec/panels/1'
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: false
        items:
          - x: 0
            "y": 5
            width: 24
            height: 11
            content:
              $ref: '#/spec/panels/2_0'
          - x: 0
            "y": 16
            width: 24
            height: 12
            content:
